<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131B" />
      <stop offset="100%" stop-color="#07090D" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18202C" />
      <stop offset="100%" stop-color="#10151E" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B99A61" />
      <stop offset="100%" stop-color="#D1B784" />
    </linearGradient>
  </defs>

  <!-- Deep Canvas -->
  <rect width="960" height="480" rx="12" fill="url(#bgBox)" stroke="#222B38" stroke-width="2" />

  <!-- Diagram Title -->
  <text x="480" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#D1B784" text-anchor="middle" letter-spacing="1">FULL AUTONOMOUS MISSION PIPELINE</text>
  <text x="480" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#7FB3A3" text-anchor="middle">End-to-End Flight Execution, Navigation &amp; Telemetry Reporting</text>

  <!-- STAGE 1: FLEET INIT -->
  <g transform="translate(40, 95)">
    <rect width="260" height="155" rx="8" fill="url(#cardGrad)" stroke="#B99A61" stroke-width="1.8" />
    <path d="M 0 0 L 260 0 L 260 30 L 0 30 Z" fill="#B99A61" opacity="0.2" />
    <text x="130" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#D1B784" text-anchor="middle">1. INITIALIZATION</text>
    
    <text x="16" y="55" font-family="monospace" font-size="11" fill="#FFF9ED">• struct Drone { id, name, bat }</text>
    <text x="16" y="77" font-family="monospace" font-size="11" fill="#FFF9ED">• struct Waypoint { x, y, alt }</text>
    <text x="16" y="99" font-family="monospace" font-size="11" fill="#7FB3A3">• vector&lt;Drone&gt; fleet</text>
    <text x="16" y="121" font-family="monospace" font-size="11" fill="#7FB3A3">• is_launch_ready(drone) &gt;= 50%</text>
    <text x="16" y="141" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#A0AAB8">Pre-flight system checks pass</text>
  </g>

  <!-- Connecting Arrow 1 -> 2 -->
  <g transform="translate(305, 172)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#D1B784" stroke-width="3" stroke-linecap="round" />
    <polygon points="35,0 26,-6 26,6" fill="#D1B784" />
  </g>

  <!-- STAGE 2: TRAJECTORY LOOP -->
  <g transform="translate(345, 95)">
    <rect width="270" height="155" rx="8" fill="url(#cardGrad)" stroke="#7FB3A3" stroke-width="2" />
    <path d="M 0 0 L 270 0 L 270 30 L 0 30 Z" fill="#7FB3A3" opacity="0.2" />
    <text x="135" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#7FB3A3" text-anchor="middle">2. SIMULATION LOOP</text>
    
    <text x="16" y="55" font-family="monospace" font-size="11" fill="#FFF9ED">for each waypoint (x, y):</text>
    <text x="24" y="75" font-family="monospace" font-size="10.5" fill="#D1B784">cost = abs(dx) + abs(dy)</text>
    <text x="24" y="95" font-family="monospace" font-size="10.5" fill="#D1B784">battery -= cost</text>
    <text x="24" y="115" font-family="monospace" font-size="10.5" fill="#7FB3A3">if (is_hazard(x, y)) alt += 20</text>
    <text x="24" y="135" font-family="monospace" font-size="10.5" fill="#FF8E72">if (battery &lt;= 0) break</text>
  </g>

  <!-- Connecting Arrow 2 -> 3 -->
  <g transform="translate(620, 172)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#7FB3A3" stroke-width="3" stroke-linecap="round" />
    <polygon points="35,0 26,-6 26,6" fill="#7FB3A3" />
  </g>

  <!-- STAGE 3: LOG & TELEMETRY -->
  <g transform="translate(660, 95)">
    <rect width="260" height="155" rx="8" fill="url(#cardGrad)" stroke="#B99A61" stroke-width="1.8" />
    <path d="M 0 0 L 260 0 L 260 30 L 0 30 Z" fill="#B99A61" opacity="0.2" />
    <text x="130" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#D1B784" text-anchor="middle">3. TELEMETRY &amp; LOG</text>
    
    <text x="16" y="55" font-family="monospace" font-size="11" fill="#FFF9ED">• ofstream blackbox("flight.log")</text>
    <text x="16" y="77" font-family="monospace" font-size="11" fill="#FFF9ED">• setw(10) &lt;&lt; drone.name</text>
    <text x="16" y="99" font-family="monospace" font-size="11" fill="#7FB3A3">• fixed &lt;&lt; setprecision(1)</text>
    <text x="16" y="121" font-family="monospace" font-size="11" fill="#D1B784">• Status: SUCCESS / RECOVERY</text>
    <text x="16" y="141" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#A0AAB8">Permanent mission audit record</text>
  </g>

  <!-- FULL STACK SYNTHESIS BAR (BOTTOM) -->
  <g transform="translate(40, 280)">
    <rect width="880" height="165" rx="10" fill="#0E1520" stroke="#B99A61" stroke-width="1.5" />
    <text x="440" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#D1B784" text-anchor="middle">COMPLETE C++ CURRICULUM SYNTHESIS (CHAPTERS 1–32)</text>
    
    <!-- 4 Pillar Blocks -->
    <g transform="translate(25, 48)">
      <rect width="190" height="98" rx="6" fill="#151E2B" stroke="#2D3A4D" />
      <text x="95" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#7FB3A3" text-anchor="middle">1. CORE CONTROL</text>
      <text x="14" y="46" font-family="monospace" font-size="9.5" fill="#E2E8F0">• Types: int, double, bool</text>
      <text x="14" y="64" font-family="monospace" font-size="9.5" fill="#E2E8F0">• Loops: for, while</text>
      <text x="14" y="82" font-family="monospace" font-size="9.5" fill="#E2E8F0">• Branching: if / else</text>
    </g>

    <g transform="translate(235, 48)">
      <rect width="190" height="98" rx="6" fill="#151E2B" stroke="#2D3A4D" />
      <text x="95" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#7FB3A3" text-anchor="middle">2. DATA STRUCTURES</text>
      <text x="14" y="46" font-family="monospace" font-size="9.5" fill="#E2E8F0">• Arrays: 1D &amp; 2D</text>
      <text x="14" y="64" font-family="monospace" font-size="9.5" fill="#E2E8F0">• Dynamic: vector&lt;T&gt;</text>
      <text x="14" y="82" font-family="monospace" font-size="9.5" fill="#E2E8F0">• Objects: struct Model</text>
    </g>

    <g transform="translate(445, 48)">
      <rect width="190" height="98" rx="6" fill="#151E2B" stroke="#2D3A4D" />
      <text x="95" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#7FB3A3" text-anchor="middle">3. FUNCTIONS &amp; FLOW</text>
      <text x="14" y="46" font-family="monospace" font-size="9.5" fill="#E2E8F0">• Modular decompose</text>
      <text x="14" y="64" font-family="monospace" font-size="9.5" fill="#E2E8F0">• References: const &amp;</text>
      <text x="14" y="82" font-family="monospace" font-size="9.5" fill="#E2E8F0">• Overloading &amp; scope</text>
    </g>

    <g transform="translate(655, 48)">
      <rect width="190" height="98" rx="6" fill="#151E2B" stroke="#2D3A4D" />
      <text x="95" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#7FB3A3" text-anchor="middle">4. STREAMS &amp; IO</text>
      <text x="14" y="46" font-family="monospace" font-size="9.5" fill="#E2E8F0">• Strings: std::string</text>
      <text x="14" y="64" font-family="monospace" font-size="9.5" fill="#E2E8F0">• Format: &lt;iomanip&gt;</text>
      <text x="14" y="82" font-family="monospace" font-size="9.5" fill="#E2E8F0">• Files &amp; Defense: clear()</text>
    </g>
  </g>
</svg>