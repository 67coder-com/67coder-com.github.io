<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%">
  <title>IEEE 754 floating-point memory layout and precision</title>
  <desc>Diagram comparing the binary layout and precision of 32-bit float and 64-bit double types under the IEEE 754 standard. Float allocates 1 sign bit, 8 exponent bits, and 23 mantissa bits providing about 7 decimal digits of precision. Double allocates 1 sign bit, 11 exponent bits, and 52 mantissa bits providing 15 to 17 decimal digits of precision.</desc>

  <!-- Background -->
  <rect width="880" height="280" rx="10" fill="#0D1117" />

  <!-- Title -->
  <text x="24" y="34" fill="#8E887D" font-size="12" letter-spacing="1.6" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">IEEE 754 FLOATING-POINT MEMORY LAYOUT</text>

  <!-- === FLOAT (32 BITS / 4 BYTES) === -->
  <g transform="translate(24, 52)">
    <rect width="832" height="88" rx="8" fill="#151A22" stroke="#2A313C" stroke-width="1.5" />
    <text x="16" y="24" fill="#D8D0C2" font-size="16" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">float (4 bytes / 32 bits)</text>
    <text x="816" y="24" text-anchor="end" fill="#8E887D" font-size="12" letter-spacing="1.2" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">~7 DECIMAL DIGITS</text>

    <!-- Segments -->
    <!-- Sign: 1 bit -->
    <rect x="16" y="38" width="60" height="34" rx="4" fill="#1E2530" stroke="#2A313C" stroke-width="1" />
    <text x="46" y="59" text-anchor="middle" fill="#8E887D" font-size="11" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">SIGN: 1</text>

    <!-- Exponent: 8 bits -->
    <rect x="82" y="38" width="220" height="34" rx="4" fill="#1E2530" stroke="#2A313C" stroke-width="1" />
    <text x="192" y="59" text-anchor="middle" fill="#B7B0A4" font-size="12" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">EXPONENT: 8 BITS</text>

    <!-- Mantissa: 23 bits (Brass accent) -->
    <rect x="308" y="38" width="508" height="34" rx="4" fill="#1E2530" stroke="#B99A61" stroke-width="1.5" />
    <text x="562" y="59" text-anchor="middle" fill="#D8D0C2" font-size="12" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">MANTISSA / FRACTION: 23 BITS</text>
  </g>

  <!-- === DOUBLE (64 BITS / 8 BYTES) === -->
  <g transform="translate(24, 156)">
    <rect width="832" height="96" rx="8" fill="#151A22" stroke="#B99A61" stroke-width="1.5" />
    <text x="16" y="24" fill="#D8D0C2" font-size="16" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">double (8 bytes / 64 bits) — C++ default</text>
    <text x="816" y="24" text-anchor="end" fill="#B99A61" font-size="12" letter-spacing="1.2" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">~15—17 DECIMAL DIGITS</text>

    <!-- Segments -->
    <!-- Sign: 1 bit -->
    <rect x="16" y="42" width="60" height="34" rx="4" fill="#1E2530" stroke="#2A313C" stroke-width="1" />
    <text x="46" y="63" text-anchor="middle" fill="#8E887D" font-size="11" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">SIGN: 1</text>

    <!-- Exponent: 11 bits -->
    <rect x="82" y="42" width="180" height="34" rx="4" fill="#1E2530" stroke="#2A313C" stroke-width="1" />
    <text x="172" y="63" text-anchor="middle" fill="#B7B0A4" font-size="12" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">EXPONENT: 11 BITS</text>

    <!-- Mantissa: 52 bits (Accent glow) -->
    <rect x="268" y="42" width="548" height="34" rx="4" fill="#1E2530" stroke="#B99A61" stroke-width="1.5" />
    <text x="542" y="63" text-anchor="middle" fill="#D8D0C2" font-size="12" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">MANTISSA / FRACTION: 52 BITS (HIGH PRECISION)</text>
  </g>
</svg>
