<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <title>C++ Funkciju pārslogošana un mainīgo redzamības apgabals</title>
  <desc>Shēma attēlo funkciju pārslogošanu (vienāds nosaukums ar atšķirīgiem parametriem, ko kompilators atrisina kompilācijas laikā) un mainīgo bloka redzamības apgabalu ({ }), kura robežās mainīgais eksistē.</desc>

  <!-- Background -->
  <rect width="880" height="340" rx="10" fill="#0D1117" />

  <!-- Title Header -->
  <text x="24" y="34" fill="#8E887D" font-size="12" letter-spacing="1.6" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">FUNKCIJU PĀRSLODZE UN MAINĪGO REDZAMĪBAS APGABALS (SCOPE)</text>

  <!-- Left Card: Function Overloading -->
  <g transform="translate(24, 52)">
    <rect width="410" height="264" rx="8" fill="#151A22" stroke="#2A313C" stroke-width="1.5" />
    <text x="20" y="28" fill="#7FB3A3" font-size="11" letter-spacing="1.2" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">1. PĀRSLODZE: VIENĀDS NOSAUKUMS, DAŽĀDI PARAMETRI</text>
    
    <!-- Signature 1: Scout -->
    <rect x="20" y="44" width="370" height="52" rx="4" fill="#1E2530" stroke="#7FB3A3" stroke-width="1.5" />
    <text x="32" y="66" fill="#7FB3A3" font-size="11" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">// Izlūks Sigma: 1 parametrs</text>
    <text x="32" y="84" fill="#D8D0C2" font-size="13" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)"><tspan fill="#7FB3A3">int</tspan> <tspan fill="#D1B784" font-weight="bold">thrust</tspan>(<tspan fill="#82AAFF">int dist</tspan>);</text>

    <!-- Signature 2: Cargo -->
    <rect x="20" y="106" width="370" height="52" rx="4" fill="#1E2530" stroke="#D1B784" stroke-width="1.5" />
    <text x="32" y="128" fill="#D1B784" font-size="11" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">// Kravas drons Omega: 2 parametri</text>
    <text x="32" y="146" fill="#D8D0C2" font-size="13" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)"><tspan fill="#7FB3A3">int</tspan> <tspan fill="#D1B784" font-weight="bold">thrust</tspan>(<tspan fill="#82AAFF">int dist, int mass</tspan>);</text>

    <!-- Resolution Note -->
    <g transform="translate(20, 168)">
      <rect width="370" height="78" rx="4" fill="#1B222C" stroke="#2A313C" stroke-width="1" />
      <polygon points="12,20 20,16 20,24" fill="#7FB3A3" />
      <text x="28" y="22" fill="#D8D0C2" font-size="11" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">thrust(50) → izsauc <tspan fill="#7FB3A3">Sigma variantu (1 arg)</tspan></text>
      
      <polygon points="12,46 20,42 20,50" fill="#D1B784" />
      <text x="28" y="48" fill="#D8D0C2" font-size="11" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">thrust(50, 1200) → izsauc <tspan fill="#D1B784">Omega variantu (2 arg)</tspan></text>
      
      <text x="28" y="68" fill="#8E887D" font-size="10" style="font-family: var(--font-sans, Inter, sans-serif)">Kompilators atpazīst atbilstošo funkciju jau kompilācijas laikā</text>
    </g>
  </g>

  <!-- Right Card: Variable Scope and Lifetime -->
  <g transform="translate(446, 52)">
    <rect width="410" height="264" rx="8" fill="#151A22" stroke="#2A313C" stroke-width="1.5" />
    <text x="20" y="28" fill="#82AAFF" font-size="11" letter-spacing="1.2" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">2. BLOKA REDZAMĪBA: MAINĪGO DZĪVES CIKLS</text>
    
    <!-- Code Box with Nested Scope -->
    <rect x="20" y="44" width="370" height="114" rx="6" fill="#1E2530" stroke="#82AAFF" stroke-width="1.5" />
    
    <text x="32" y="66" fill="#D8D0C2" font-size="12" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">int active = 1; <tspan fill="#7FB3A3">// Ārējais apgabals</tspan></text>
    <text x="32" y="86" fill="#D8D0C2" font-size="12" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">{</text>
    <text x="52" y="106" fill="#D8D0C2" font-size="12" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">int temp = 99; <tspan fill="#82AAFF">// Tikai iekšējais bloks</tspan></text>
    <text x="32" y="126" fill="#D8D0C2" font-size="12" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">} <tspan fill="#CE8A78">// temp IZNĪCINĀTS pie beigu iekavas</tspan></text>
    <text x="32" y="146" fill="#CE8A78" font-size="12" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">temp = 10; // KĻŪDA: ārpus redzamības apgabala!</text>

    <!-- Scope Rules -->
    <g transform="translate(20, 168)">
      <rect width="370" height="78" rx="4" fill="#1B222C" stroke="#2A313C" stroke-width="1" />
      <circle cx="16" cy="20" r="5" fill="#7FB3A3" />
      <text x="28" y="24" fill="#D8D0C2" font-size="11" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">Ārējie mainīgie ir redzami iekšējos blokos</text>
      
      <circle cx="16" cy="44" r="5" fill="#CE8A78" />
      <text x="28" y="48" fill="#D8D0C2" font-size="11" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">Iekšējie mainīgie beidz eksistēt aiz figūriekavas }</text>

      <circle cx="16" cy="66" r="5" fill="#D1B784" />
      <text x="28" y="70" fill="#D8D0C2" font-size="11" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">Globālās const konstantes pieejamas visā programmā</text>
    </g>
  </g>
</svg>
