<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <title>C++ koda kompilācijas un izpildes plūsma</title>
  <desc>Shēma rāda C++ programmas ceļu: pirmkods main.cpp nonāk kompilatorā, kas to pārtulko mašīnkodā un izveido izpildāmo failu. Izpildāmais fails dod termināļa izvadi. Sintakses kļūdas gadījumā kompilators apstājas un programma netiek palaista.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#B7B0A4" />
    </marker>
  </defs>

  <!-- Fona pamatne -->
  <rect width="880" height="260" rx="10" fill="#0D1117" />

  <!-- Virsraksts -->
  <text x="24" y="38" fill="#8E887D" font-size="12" letter-spacing="1.6" style="font-family: var(--font-mono, &#39;JetBrains Mono&#39;, monospace)">KĀ C++ PROGRAMMA KĻŪST PAR IZVADI</text>

  <!-- 1. Bloks: Pirmkods -->
  <rect x="24" y="60" width="180" height="96" rx="8" fill="#151A22" stroke="#2A313C" stroke-width="1.5" />
  <text x="114" y="94" text-anchor="middle" fill="#8E887D" font-size="12" letter-spacing="1.6" style="font-family: var(--font-mono, &#39;JetBrains Mono&#39;, monospace)">PIRMKODS</text>
  <text x="114" y="126" text-anchor="middle" fill="#D8D0C2" font-size="18" style="font-family: var(--font-mono, &#39;JetBrains Mono&#39;, monospace)">main.cpp</text>

  <!-- Bultiņa 1 -> 2 -->
  <line x1="204" y1="108" x2="238" y2="108" stroke="#B7B0A4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 2. Bloks: Kompilators (Viens galvenais akcents: misiņš #B99A61) -->
  <rect x="244" y="60" width="184" height="96" rx="8" fill="#151A22" stroke="#B99A61" stroke-width="2" />
  <text x="336" y="94" text-anchor="middle" fill="#8E887D" font-size="12" letter-spacing="1.6" style="font-family: var(--font-mono, &#39;JetBrains Mono&#39;, monospace)">KOMPILATORS</text>
  <text x="336" y="126" text-anchor="middle" fill="#D8D0C2" font-size="18" style="font-family: var(--font-sans, Inter, sans-serif)">pārtulko</text>

  <!-- Bultiņa 2 -> 3 -->
  <line x1="428" y1="108" x2="462" y2="108" stroke="#B7B0A4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 3. Bloks: Izpildāmais fails -->
  <rect x="468" y="60" width="188" height="96" rx="8" fill="#151A22" stroke="#2A313C" stroke-width="1.5" />
  <text x="562" y="94" text-anchor="middle" fill="#8E887D" font-size="12" letter-spacing="1.6" style="font-family: var(--font-mono, &#39;JetBrains Mono&#39;, monospace)">IZPILDĀMAIS FAILS</text>
  <text x="562" y="126" text-anchor="middle" fill="#D8D0C2" font-size="18" style="font-family: var(--font-sans, Inter, sans-serif)">mašīnkods</text>

  <!-- Bultiņa 3 -> 4 -->
  <line x1="656" y1="108" x2="690" y2="108" stroke="#B7B0A4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 4. Bloks: Izvade terminālī -->
  <rect x="696" y="60" width="160" height="96" rx="8" fill="#151A22" stroke="#2A313C" stroke-width="1.5" />
  <text x="776" y="94" text-anchor="middle" fill="#8E887D" font-size="12" letter-spacing="1.6" style="font-family: var(--font-mono, &#39;JetBrains Mono&#39;, monospace)">IZVADE</text>
  <text x="776" y="126" text-anchor="middle" fill="#A9B79B" font-size="17" style="font-family: var(--font-mono, &#39;JetBrains Mono&#39;, monospace)">IRIS: online</text>

  <!-- Kļūdas atzars (sarkanais/terakota #CE8A78) -->
  <line x1="336" y1="156" x2="336" y2="204" stroke="#CE8A78" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="336" cy="208" r="3" fill="#CE8A78" />
  <text x="348" y="213" fill="#CE8A78" font-size="16" style="font-family: var(--font-sans, Inter, sans-serif)">sintakses kļūda → programma netiek palaista</text>
</svg>