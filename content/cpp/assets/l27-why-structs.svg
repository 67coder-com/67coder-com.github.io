<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hangarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="40%" stop-color="#141B26"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <!-- Blueprint Glow Gradients -->
    <linearGradient id="goldAmber27" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B99A61"/>
      <stop offset="100%" stop-color="#E5C78A"/>
    </linearGradient>

    <linearGradient id="cyanSage27" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C9482"/>
      <stop offset="100%" stop-color="#7FB3A3"/>
    </linearGradient>

    <filter id="neonGlow27" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hangar Background -->
  <rect width="960" height="540" fill="url(#hangarBg)"/>

  <!-- Background Cybernetic Grid Lines -->
  <g stroke="#1A2535" stroke-width="1" opacity="0.6">
    <line x1="0" y1="90" x2="960" y2="90"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
    <line x1="160" y1="0" x2="160" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="540"/>
    <line x1="640" y1="0" x2="640" y2="540"/>
    <line x1="800" y1="0" x2="800" y2="540"/>
  </g>

  <!-- Central Holographic Blueprint: Unified Drone Data Structure -->
  <g transform="translate(160, 70)">
    <!-- Outer Blueprint Bounding Box -->
    <rect x="0" y="0" width="460" height="350" rx="14" fill="#0E1724" fill-opacity="0.85" stroke="#37526D" stroke-width="2" filter="url(#neonGlow27)"/>
    <rect x="10" y="10" width="440" height="330" rx="10" fill="none" stroke="#22364C" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Composite Data Card 1: ID Field -->
    <g transform="translate(30, 35)">
      <rect width="400" height="52" rx="8" fill="#152233" stroke="#B99A61" stroke-width="1.5"/>
      <rect x="15" y="16" width="20" height="20" rx="4" fill="#B99A61"/>
      <rect x="50" y="20" width="60" height="12" rx="3" fill="#D1B784"/>
      <rect x="260" y="20" width="110" height="12" rx="3" fill="#E4DCDB" opacity="0.8"/>
    </g>

    <!-- Composite Data Card 2: Position (X, Y) Fields -->
    <g transform="translate(30, 100)">
      <rect width="400" height="52" rx="8" fill="#152233" stroke="#4C9482" stroke-width="1.5"/>
      <rect x="15" y="16" width="20" height="20" rx="4" fill="#7FB3A3"/>
      <rect x="50" y="20" width="80" height="12" rx="3" fill="#7FB3A3"/>
      <rect x="240" y="20" width="130" height="12" rx="3" fill="#E4DCDB" opacity="0.8"/>
    </g>

    <!-- Composite Data Card 3: Battery Level Field -->
    <g transform="translate(30, 165)">
      <rect width="400" height="52" rx="8" fill="#152233" stroke="#B99A61" stroke-width="1.5"/>
      <rect x="15" y="16" width="20" height="20" rx="4" fill="#B99A61"/>
      <rect x="50" y="20" width="70" height="12" rx="3" fill="#D1B784"/>
      <!-- Battery Meter Graphic -->
      <rect x="250" y="18" width="120" height="16" rx="4" fill="#0C1520" stroke="#364E68"/>
      <rect x="252" y="20" width="95" height="12" rx="2" fill="#7FB3A3"/>
    </g>

    <!-- Composite Data Card 4: Flight Status Field -->
    <g transform="translate(30, 230)">
      <rect width="400" height="52" rx="8" fill="#152233" stroke="#4C9482" stroke-width="1.5"/>
      <rect x="15" y="16" width="20" height="20" rx="4" fill="#7FB3A3"/>
      <rect x="50" y="20" width="90" height="12" rx="3" fill="#7FB3A3"/>
      <circle cx="340" cy="26" r="8" fill="#7FB3A3"/>
      <circle cx="365" cy="26" r="8" fill="#B99A61"/>
    </g>

    <!-- Golden Lock Bracket Uniting the Fields into One Unit -->
    <path d="M 15 30 L 5 30 L 5 315 L 15 315" fill="none" stroke="#E5C78A" stroke-width="3.5"/>
    <path d="M 445 30 L 455 30 L 455 315 L 445 315" fill="none" stroke="#E5C78A" stroke-width="3.5"/>
    <circle cx="5" cy="172" r="6" fill="#E5C78A"/>
    <circle cx="455" cy="172" r="6" fill="#E5C78A"/>
  </g>

  <!-- Floor Assembly Platform -->
  <polygon points="40,460 920,460 960,540 0,540" fill="#111722" stroke="#253549" stroke-width="2"/>
  <line x1="200" y1="460" x2="160" y2="540" stroke="#223042" stroke-width="3"/>
  <line x1="760" y1="460" x2="800" y2="540" stroke="#223042" stroke-width="3"/>

  <!-- Robot Mascot IRIS [ o o ] -->
  <g transform="translate(710, 240)">
    <!-- Cast Shadow -->
    <ellipse cx="65" cy="195" rx="55" ry="16" fill="#04060A" opacity="0.85"/>

    <!-- Chassis Body -->
    <rect x="25" y="85" width="80" height="90" rx="16" fill="#1D2636" stroke="#3A4D6B" stroke-width="2.5"/>
    <rect x="42" y="105" width="46" height="26" rx="6" fill="#0C131D" stroke="#2B3C54" stroke-width="1.5"/>
    <circle cx="53" cy="118" r="4" fill="#7FB3A3"/>
    <circle cx="65" cy="118" r="4" fill="#D1B784"/>
    <circle cx="77" cy="118" r="4" fill="#7FB3A3"/>

    <!-- Neck Connector -->
    <rect x="52" y="70" width="26" height="18" rx="4" fill="#2E3C52"/>

    <!-- Head Unit (Rounded Cube) -->
    <rect x="10" y="5" width="110" height="72" rx="22" fill="#243145" stroke="#485F84" stroke-width="3"/>
    
    <!-- Visor -->
    <rect x="22" y="19" width="86" height="44" rx="14" fill="#090E17" stroke="#1D293D" stroke-width="2"/>

    <!-- Horizontal Pill Eyes [ o o ] -->
    <rect x="36" y="31" width="22" height="18" rx="8" fill="#7FB3A3" filter="url(#neonGlow27)"/>
    <rect x="72" y="31" width="22" height="18" rx="8" fill="#7FB3A3" filter="url(#neonGlow27)"/>
    <circle cx="44" cy="38" r="3" fill="#FFFFFF"/>
    <circle cx="80" cy="38" r="3" fill="#FFFFFF"/>

    <!-- Sensor Rod -->
    <line x1="65" y1="5" x2="65" y2="-18" stroke="#485F84" stroke-width="4" stroke-linecap="round"/>
    <circle cx="65" cy="-22" r="6" fill="#D1B784" filter="url(#neonGlow27)"/>

    <!-- Arm gesturing towards the unified struct blueprint -->
    <path d="M 25 110 Q -30 115 -55 75" fill="none" stroke="#2E3C52" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-57" cy="75" r="7" fill="#7FB3A3"/>
  </g>
</svg>
