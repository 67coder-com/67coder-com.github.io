<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="100%" height="100%">
  <title>Atmiņas struktūra tipiem bool, char un string</title>
  <desc>Shēma parāda pamata loģisko, rakstzīmju un teksta virkņu tipu izvietojumu atmiņā valodā C++. Tips bool aizņem 1 baitu un glabā 1 vai 0. Tips char aizņem 1 baitu un glabā ASCII rakstzīmes kodu. std::string pārvalda rakstzīmju virkni atmiņā ar dinamisku garumu, ko nosaka metode .length().</desc>

  <!-- Background -->
  <rect width="880" height="300" rx="10" fill="#0D1117" />

  <!-- Header -->
  <text x="24" y="34" fill="#8E887D" font-size="12" letter-spacing="1.6" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">ATMIŅAS STRUKTŪRA: BOOL, CHAR UN STRING</text>

  <!-- Top Row: bool and char (Single byte units) -->
  <!-- bool block -->
  <g transform="translate(24, 52)">
    <rect width="400" height="96" rx="8" fill="#151A22" stroke="#2A313C" stroke-width="1.5" />
    <text x="16" y="24" fill="#D8D0C2" font-size="15" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">bool (1 baits / 8 biti)</text>
    <text x="384" y="24" text-anchor="end" fill="#8E887D" font-size="11" letter-spacing="1.2" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">LOĢISKAIS STĀVOKLIS</text>

    <!-- Byte slot -->
    <rect x="16" y="38" width="120" height="42" rx="4" fill="#1E2530" stroke="#B99A61" stroke-width="1.5" />
    <text x="76" y="64" text-anchor="middle" fill="#B99A61" font-size="16" font-weight="bold" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">1 (true)</text>
    <text x="150" y="64" fill="#8E887D" font-size="13" style="font-family: var(--font-sans, Inter, sans-serif)">cout izvada 1 (true) vai 0 (false)</text>
  </g>

  <!-- char block -->
  <g transform="translate(456, 52)">
    <rect width="400" height="96" rx="8" fill="#151A22" stroke="#2A313C" stroke-width="1.5" />
    <text x="16" y="24" fill="#D8D0C2" font-size="15" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">char (1 baits / 8 biti)</text>
    <text x="384" y="24" text-anchor="end" fill="#8E887D" font-size="11" letter-spacing="1.2" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">ASCII SIMBOLS</text>

    <!-- Byte slot -->
    <rect x="16" y="38" width="120" height="42" rx="4" fill="#1E2530" stroke="#B99A61" stroke-width="1.5" />
    <text x="76" y="64" text-anchor="middle" fill="#D8D0C2" font-size="16" font-weight="bold" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">'S' (83)</text>
    <text x="150" y="64" fill="#8E887D" font-size="13" style="font-family: var(--font-sans, Inter, sans-serif)">Vienpēdiņas · ASCII vesels skaitlis 83</text>
  </g>

  <!-- Bottom Row: std::string sequence -->
  <g transform="translate(24, 168)">
    <rect width="832" height="110" rx="8" fill="#151A22" stroke="#B99A61" stroke-width="1.5" />
    <text x="16" y="24" fill="#D8D0C2" font-size="15" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">std::string (rakstzīmju virkne)</text>
    <text x="816" y="24" text-anchor="end" fill="#B99A61" font-size="11" letter-spacing="1.2" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">.length() = 5</text>

    <!-- Character sequence boxes -->
    <g transform="translate(16, 40)">
      <!-- S -->
      <rect x="0" y="0" width="70" height="52" rx="4" fill="#1E2530" stroke="#2A313C" stroke-width="1" />
      <text x="35" y="32" text-anchor="middle" fill="#D8D0C2" font-size="18" font-weight="bold" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">'S'</text>
      <!-- I -->
      <rect x="80" y="0" width="70" height="52" rx="4" fill="#1E2530" stroke="#2A313C" stroke-width="1" />
      <text x="115" y="32" text-anchor="middle" fill="#D8D0C2" font-size="18" font-weight="bold" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">'I'</text>
      <!-- G -->
      <rect x="160" y="0" width="70" height="52" rx="4" fill="#1E2530" stroke="#2A313C" stroke-width="1" />
      <text x="195" y="32" text-anchor="middle" fill="#D8D0C2" font-size="18" font-weight="bold" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">'G'</text>
      <!-- M -->
      <rect x="240" y="0" width="70" height="52" rx="4" fill="#1E2530" stroke="#2A313C" stroke-width="1" />
      <text x="275" y="32" text-anchor="middle" fill="#D8D0C2" font-size="18" font-weight="bold" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">'M'</text>
      <!-- A -->
      <rect x="320" y="0" width="70" height="52" rx="4" fill="#1E2530" stroke="#2A313C" stroke-width="1" />
      <text x="355" y="32" text-anchor="middle" fill="#D8D0C2" font-size="18" font-weight="bold" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">'A'</text>

      <!-- Label -->
      <text x="410" y="24" fill="#8E887D" font-size="13" style="font-family: var(--font-sans, Inter, sans-serif)">Dubultpēdiņas: "SIGMA"</text>
      <text x="410" y="44" fill="#8E887D" font-size="13" style="font-family: var(--font-sans, Inter, sans-serif)">Savienošana ar operatoru + apvieno teksta virknes</text>
    </g>
  </g>
</svg>