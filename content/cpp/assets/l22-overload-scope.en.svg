<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <title>C++ Function Overloading and Variable Scope</title>
  <desc>Visual diagram illustrating function overloading (same name with distinct parameter signatures resolved at compile time) and variable block scope with lifetime bounded by curly braces.</desc>

  <!-- Background -->
  <rect width="880" height="340" rx="10" fill="#0D1117" />

  <!-- Title Header -->
  <text x="24" y="34" fill="#8E887D" font-size="12" letter-spacing="1.6" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">FUNCTION OVERLOADING &amp; VARIABLE SCOPE ARCHITECTURE</text>

  <!-- Left Card: Function Overloading -->
  <g transform="translate(24, 52)">
    <rect width="410" height="264" rx="8" fill="#151A22" stroke="#2A313C" stroke-width="1.5" />
    <text x="20" y="28" fill="#7FB3A3" font-size="11" letter-spacing="1.2" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">1. FUNCTION OVERLOADING: SAME NAME, DIFFERENT PARAMS</text>
    
    <!-- Signature 1: Scout -->
    <rect x="20" y="44" width="370" height="52" rx="4" fill="#1E2530" stroke="#7FB3A3" stroke-width="1.5" />
    <text x="32" y="66" fill="#7FB3A3" font-size="11" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">// Scout drone Sigma: 1 parameter</text>
    <text x="32" y="84" fill="#D8D0C2" font-size="13" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)"><tspan fill="#7FB3A3">int</tspan> <tspan fill="#D1B784" font-weight="bold">thrust</tspan>(<tspan fill="#82AAFF">int dist</tspan>);</text>

    <!-- Signature 2: Cargo -->
    <rect x="20" y="106" width="370" height="52" rx="4" fill="#1E2530" stroke="#D1B784" stroke-width="1.5" />
    <text x="32" y="128" fill="#D1B784" font-size="11" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">// Cargo drone Omega: 2 parameters</text>
    <text x="32" y="146" fill="#D8D0C2" font-size="13" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)"><tspan fill="#7FB3A3">int</tspan> <tspan fill="#D1B784" font-weight="bold">thrust</tspan>(<tspan fill="#82AAFF">int dist, int mass</tspan>);</text>

    <!-- Resolution Note -->
    <g transform="translate(20, 168)">
      <rect width="370" height="78" rx="4" fill="#1B222C" stroke="#2A313C" stroke-width="1" />
      <polygon points="12,20 20,16 20,24" fill="#7FB3A3" />
      <text x="28" y="22" fill="#D8D0C2" font-size="11" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">thrust(50) → calls <tspan fill="#7FB3A3">Sigma overload (1 arg)</tspan></text>
      
      <polygon points="12,46 20,42 20,50" fill="#D1B784" />
      <text x="28" y="48" fill="#D8D0C2" font-size="11" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">thrust(50, 1200) → calls <tspan fill="#D1B784">Omega overload (2 args)</tspan></text>
      
      <text x="28" y="68" fill="#8E887D" font-size="10" style="font-family: var(--font-sans, Inter, sans-serif)">Compiler selects matching signature at compile time</text>
    </g>
  </g>

  <!-- Right Card: Variable Scope and Lifetime -->
  <g transform="translate(446, 52)">
    <rect width="410" height="264" rx="8" fill="#151A22" stroke="#2A313C" stroke-width="1.5" />
    <text x="20" y="28" fill="#82AAFF" font-size="11" letter-spacing="1.2" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">2. BLOCK SCOPE: VARIABLE LIFETIME BOUNDARIES</text>
    
    <!-- Code Box with Nested Scope -->
    <rect x="20" y="44" width="370" height="114" rx="6" fill="#1E2530" stroke="#82AAFF" stroke-width="1.5" />
    
    <text x="32" y="66" fill="#D8D0C2" font-size="12" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">int active = 1; <tspan fill="#7FB3A3">// Outer scope</tspan></text>
    <text x="32" y="86" fill="#D8D0C2" font-size="12" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">{</text>
    <text x="52" y="106" fill="#D8D0C2" font-size="12" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">int temp = 99; <tspan fill="#82AAFF">// Inner scope only</tspan></text>
    <text x="32" y="126" fill="#D8D0C2" font-size="12" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">} <tspan fill="#CE8A78">// temp DESTROYED at closing brace</tspan></text>
    <text x="32" y="146" fill="#CE8A78" font-size="12" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">temp = 10; // COMPILE ERROR: out of scope!</text>

    <!-- Scope Rules -->
    <g transform="translate(20, 168)">
      <rect width="370" height="78" rx="4" fill="#1B222C" stroke="#2A313C" stroke-width="1" />
      <circle cx="16" cy="20" r="5" fill="#7FB3A3" />
      <text x="28" y="24" fill="#D8D0C2" font-size="11" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">Outer variables are accessible inside inner blocks</text>
      
      <circle cx="16" cy="44" r="5" fill="#CE8A78" />
      <text x="28" y="48" fill="#D8D0C2" font-size="11" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">Inner variables vanish when block { } ends</text>

      <circle cx="16" cy="66" r="5" fill="#D1B784" />
      <text x="28" y="70" fill="#D8D0C2" font-size="11" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">Global consts live throughout program runtime</text>
    </g>
  </g>
</svg>
