<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#141B26"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B99A61"/>
      <stop offset="100%" stop-color="#D1B784"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="440" rx="12" fill="url(#bgGrad)" stroke="#232E3F" stroke-width="2"/>

  <!-- Title Banner -->
  <text x="40" y="44" fill="url(#headerGrad)" font-family="system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="1.2">C++ std::string UZBŪVE UN PROTOKOLU PARSĒŠANA</text>
  <text x="40" y="68" fill="#8E9DAE" font-family="system-ui, sans-serif" font-size="13">Nepārtraukts simbolu buferis, indeksācija no 0, apakšvirkņu izdalīšana un skaitļu konversija</text>

  <!-- String Buffer Representation -->
  <!-- Label -->
  <text x="40" y="108" fill="#D1B784" font-family="monospace" font-size="14" font-weight="bold">std::string cmd = "ALTITUDE 120"; // length() == 12</text>

  <!-- Cells (12 chars) -->
  <g transform="translate(40, 120)">
    <!-- Indices -->
    <text x="29" y="-8" fill="#6B7A99" font-family="monospace" font-size="12" text-anchor="middle">0</text>
    <text x="89" y="-8" fill="#6B7A99" font-family="monospace" font-size="12" text-anchor="middle">1</text>
    <text x="149" y="-8" fill="#6B7A99" font-family="monospace" font-size="12" text-anchor="middle">2</text>
    <text x="209" y="-8" fill="#6B7A99" font-family="monospace" font-size="12" text-anchor="middle">3</text>
    <text x="269" y="-8" fill="#6B7A99" font-family="monospace" font-size="12" text-anchor="middle">4</text>
    <text x="329" y="-8" fill="#6B7A99" font-family="monospace" font-size="12" text-anchor="middle">5</text>
    <text x="389" y="-8" fill="#6B7A99" font-family="monospace" font-size="12" text-anchor="middle">6</text>
    <text x="449" y="-8" fill="#6B7A99" font-family="monospace" font-size="12" text-anchor="middle">7</text>
    <text x="509" y="-8" fill="#E08272" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">8</text>
    <text x="569" y="-8" fill="#6B7A99" font-family="monospace" font-size="12" text-anchor="middle">9</text>
    <text x="629" y="-8" fill="#6B7A99" font-family="monospace" font-size="12" text-anchor="middle">10</text>
    <text x="689" y="-8" fill="#6B7A99" font-family="monospace" font-size="12" text-anchor="middle">11</text>

    <!-- Cells Rectangles -->
    <!-- 'A' -->
    <rect x="0" y="0" width="56" height="50" rx="6" fill="#172233" stroke="#374A67" stroke-width="1.5"/>
    <text x="28" y="32" fill="#E4DCDB" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">'A'</text>
    <!-- 'L' -->
    <rect x="60" y="0" width="56" height="50" rx="6" fill="#172233" stroke="#374A67" stroke-width="1.5"/>
    <text x="88" y="32" fill="#E4DCDB" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">'L'</text>
    <!-- 'T' -->
    <rect x="120" y="0" width="56" height="50" rx="6" fill="#172233" stroke="#374A67" stroke-width="1.5"/>
    <text x="148" y="32" fill="#E4DCDB" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">'T'</text>
    <!-- 'I' -->
    <rect x="180" y="0" width="56" height="50" rx="6" fill="#172233" stroke="#374A67" stroke-width="1.5"/>
    <text x="208" y="32" fill="#E4DCDB" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">'I'</text>
    <!-- 'T' -->
    <rect x="240" y="0" width="56" height="50" rx="6" fill="#172233" stroke="#374A67" stroke-width="1.5"/>
    <text x="268" y="32" fill="#E4DCDB" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">'T'</text>
    <!-- 'U' -->
    <rect x="300" y="0" width="56" height="50" rx="6" fill="#172233" stroke="#374A67" stroke-width="1.5"/>
    <text x="328" y="32" fill="#E4DCDB" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">'U'</text>
    <!-- 'D' -->
    <rect x="360" y="0" width="56" height="50" rx="6" fill="#172233" stroke="#374A67" stroke-width="1.5"/>
    <text x="388" y="32" fill="#E4DCDB" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">'D'</text>
    <!-- 'E' -->
    <rect x="420" y="0" width="56" height="50" rx="6" fill="#172233" stroke="#374A67" stroke-width="1.5"/>
    <text x="448" y="32" fill="#E4DCDB" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">'E'</text>
    <!-- ' ' delimiter -->
    <rect x="480" y="0" width="56" height="50" rx="6" fill="#2E1B1D" stroke="#D9634D" stroke-width="2"/>
    <text x="508" y="32" fill="#F09B8B" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">' '</text>
    <!-- '1' -->
    <rect x="540" y="0" width="56" height="50" rx="6" fill="#172A28" stroke="#3F6B60" stroke-width="1.5"/>
    <text x="568" y="32" fill="#7FB3A3" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">'1'</text>
    <!-- '2' -->
    <rect x="600" y="0" width="56" height="50" rx="6" fill="#172A28" stroke="#3F6B60" stroke-width="1.5"/>
    <text x="628" y="32" fill="#7FB3A3" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">'2'</text>
    <!-- '0' -->
    <rect x="660" y="0" width="56" height="50" rx="6" fill="#172A28" stroke="#3F6B60" stroke-width="1.5"/>
    <text x="688" y="32" fill="#7FB3A3" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">'0'</text>

    <!-- Null terminator hint -->
    <rect x="720" y="6" width="36" height="38" rx="4" fill="#0C1017" stroke="#253040" stroke-dasharray="3 3"/>
    <text x="738" y="30" fill="#506175" font-family="monospace" font-size="12" text-anchor="middle">\0</text>
  </g>

  <!-- Step-by-Step Operations Cards -->
  <!-- Card 1: find() -->
  <g transform="translate(40, 205)">
    <rect width="235" height="205" rx="8" fill="#151C28" stroke="#2D3B4E" stroke-width="1.5"/>
    <rect x="0" y="0" width="235" height="34" rx="8" fill="#1B2536"/>
    <text x="14" y="23" fill="#D9634D" font-family="monospace" font-size="13" font-weight="bold">1. MEKLĒŠANA: .find()</text>
    
    <text x="14" y="60" fill="#D1B784" font-family="monospace" font-size="12">size_t pos = cmd.find(' ');</text>
    <text x="14" y="80" fill="#8E9DAE" font-family="sans-serif" font-size="12">Atrod pirmās atstarpes indeksu:</text>
    <rect x="14" y="92" width="205" height="30" rx="4" fill="#2E1B1D" stroke="#D9634D" stroke-width="1"/>
    <text x="24" y="112" fill="#F09B8B" font-family="monospace" font-size="13" font-weight="bold">pos == 8</text>

    <text x="14" y="145" fill="#8E9DAE" font-family="sans-serif" font-size="11">Drošības pārbaude:</text>
    <text x="14" y="165" fill="#E4DCDB" font-family="monospace" font-size="11">if (pos != string::npos)</text>
    <text x="14" y="185" fill="#7FB3A3" font-family="sans-serif" font-size="11">Atdalītājs paketē pastāv!</text>
  </g>

  <!-- Card 2: substr() -->
  <g transform="translate(295, 205)">
    <rect width="250" height="205" rx="8" fill="#151C28" stroke="#2D3B4E" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="34" rx="8" fill="#1B2536"/>
    <text x="14" y="23" fill="#D1B784" font-family="monospace" font-size="13" font-weight="bold">2. IZDALĪŠANA: .substr()</text>
    
    <text x="14" y="58" fill="#8E9DAE" font-family="sans-serif" font-size="11">Izvelk komandas darbību:</text>
    <text x="14" y="76" fill="#D1B784" font-family="monospace" font-size="12">string verb = cmd.substr(0, 8);</text>
    <rect x="14" y="86" width="220" height="26" rx="4" fill="#1D2636"/>
    <text x="24" y="104" fill="#D8D0C2" font-family="monospace" font-size="12">→ "ALTITUDE"</text>

    <text x="14" y="132" fill="#8E9DAE" font-family="sans-serif" font-size="11">Izvelk parametra vērtību:</text>
    <text x="14" y="150" fill="#7FB3A3" font-family="monospace" font-size="12">string arg = cmd.substr(8 + 1);</text>
    <rect x="14" y="160" width="220" height="26" rx="4" fill="#132321"/>
    <text x="24" y="178" fill="#7FB3A3" font-family="monospace" font-size="12">→ "120"</text>
  </g>

  <!-- Card 3: stoi() / stod() -->
  <g transform="translate(565, 205)">
    <rect width="235" height="205" rx="8" fill="#151C28" stroke="#2D3B4E" stroke-width="1.5"/>
    <rect x="0" y="0" width="235" height="34" rx="8" fill="#1B2536"/>
    <text x="14" y="23" fill="#7FB3A3" font-family="monospace" font-size="13" font-weight="bold">3. PARSĒŠANA: stoi()</text>
    
    <text x="14" y="60" fill="#8E9DAE" font-family="sans-serif" font-size="12">Pārvērš tekstu binārā skaitlī:</text>
    <text x="14" y="82" fill="#7FB3A3" font-family="monospace" font-size="12">int target = stoi(arg);</text>
    <rect x="14" y="94" width="205" height="32" rx="4" fill="#172A28" stroke="#3F6B60" stroke-width="1"/>
    <text x="24" y="115" fill="#7FB3A3" font-family="monospace" font-size="14" font-weight="bold">target == 120 (int)</text>

    <text x="14" y="148" fill="#8E9DAE" font-family="sans-serif" font-size="11">Peldošā komata konversija:</text>
    <text x="14" y="168" fill="#D1B784" font-family="monospace" font-size="11">double speed = stod(arg);</text>
    <text x="14" y="188" fill="#8E9DAE" font-family="sans-serif" font-size="11">Gatavs lidojuma kontroles ciklam!</text>
  </g>
</svg>
