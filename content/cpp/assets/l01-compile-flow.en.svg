<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">How a C++ program becomes output</title>
  <desc id="d">The source file main.cpp goes into the compiler. The compiler translates it into machine code and produces an executable which, when run, prints IRIS: online. If there is a syntax error, the compiler stops and the program never runs.</desc>
  <rect width="880" height="270" rx="10" fill="#0D1117"/>
  <text x="24" y="40" fill="#8E887D" font-size="12" letter-spacing="1.6" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">HOW A C++ PROGRAM BECOMES OUTPUT</text>
  <g>
    <rect x="24" y="70" width="190" height="96" rx="8" fill="#151A22" stroke="#2A313C" stroke-width="1.5"/>
    <text x="119.0" y="104" text-anchor="middle" fill="#8E887D" font-size="12" letter-spacing="1.6" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">SOURCE CODE</text>
    <text x="119.0" y="138" text-anchor="middle" fill="#D8D0C2" font-size="18" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">main.cpp</text>
  </g>
  <g>
    <rect x="238" y="70" width="190" height="96" rx="8" fill="#151A22" stroke="#B99A61" stroke-width="2"/>
    <text x="333.0" y="104" text-anchor="middle" fill="#8E887D" font-size="12" letter-spacing="1.6" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">COMPILER</text>
    <text x="333.0" y="138" text-anchor="middle" fill="#D8D0C2" font-size="18" style="font-family: var(--font-sans, Inter, sans-serif)">translates</text>
  </g>
  <g>
    <rect x="452" y="70" width="190" height="96" rx="8" fill="#151A22" stroke="#2A313C" stroke-width="1.5"/>
    <text x="547.0" y="104" text-anchor="middle" fill="#8E887D" font-size="12" letter-spacing="1.6" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">EXECUTABLE</text>
    <text x="547.0" y="138" text-anchor="middle" fill="#D8D0C2" font-size="18" style="font-family: var(--font-sans, Inter, sans-serif)">machine code</text>
  </g>
  <g>
    <rect x="666" y="70" width="190" height="96" rx="8" fill="#151A22" stroke="#2A313C" stroke-width="1.5"/>
    <text x="761.0" y="104" text-anchor="middle" fill="#8E887D" font-size="12" letter-spacing="1.6" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">OUTPUT</text>
    <text x="761.0" y="138" text-anchor="middle" fill="#D8D0C2" font-size="18" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">IRIS: online</text>
  </g>
  <line x1="220" y1="118" x2="230" y2="118" stroke="#B7B0A4" stroke-width="1.8"/>
  <path d="M 230 112 L 238 118 L 230 124 Z" fill="#B7B0A4"/>
  <line x1="434" y1="118" x2="444" y2="118" stroke="#B7B0A4" stroke-width="1.8"/>
  <path d="M 444 112 L 452 118 L 444 124 Z" fill="#B7B0A4"/>
  <line x1="648" y1="118" x2="658" y2="118" stroke="#B7B0A4" stroke-width="1.8"/>
  <path d="M 658 112 L 666 118 L 658 124 Z" fill="#B7B0A4"/>
  <line x1="333.0" y1="166" x2="333.0" y2="206" stroke="#CE8A78" stroke-width="1.8" stroke-dasharray="4 4"/>
  <text x="333.0" y="230" text-anchor="middle" fill="#CE8A78" font-size="15" style="font-family: var(--font-sans, Inter, sans-serif)">syntax error → the program never runs</text>
</svg>
