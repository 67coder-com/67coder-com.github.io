<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <title>C++ Parameter Passing: Value vs Reference vs Const Reference</title>
  <desc>Diagram showing C++ parameter passing modes. Left panel: Pass by value creates an isolated copy. Middle panel: Pass by reference modifies original variable directly in memory. Right panel: Const reference avoids copying large data while preventing accidental modification.</desc>

  <!-- Background -->
  <rect width="880" height="340" rx="10" fill="#0D1117" />

  <!-- Title Header -->
  <text x="24" y="34" fill="#8E887D" font-size="12" letter-spacing="1.6" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">PARAMETER PASSING MODES: VALUE VS REFERENCE (&amp;) VS CONST REF</text>

  <!-- Card 1: Pass by Value -->
  <g transform="translate(24, 52)">
    <rect width="264" height="264" rx="8" fill="#151A22" stroke="#2A313C" stroke-width="1.5" />
    <text x="16" y="26" fill="#8E887D" font-size="11" letter-spacing="1.1" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">1. PASS BY VALUE: int x</text>
    
    <rect x="16" y="42" width="232" height="90" rx="4" fill="#1E2530" stroke="#2A313C" stroke-width="1" />
    <text x="26" y="66" fill="#D8D0C2" font-size="12" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">void burn(<tspan fill="#D1B784">int x</tspan>) {</text>
    <text x="44" y="88" fill="#D8D0C2" font-size="12" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">x -= 20; // copy</text>
    <text x="26" y="110" fill="#D8D0C2" font-size="12" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">}</text>

    <!-- Visual Memory Box -->
    <rect x="16" y="146" width="232" height="100" rx="4" fill="#1A202A" stroke="#2A313C" stroke-width="1" />
    <text x="26" y="172" fill="#D8D0C2" font-size="11" style="font-family: var(--font-sans, Inter, sans-serif)">main: <tspan fill="#7FB3A3" font-weight="bold">fuel = 100</tspan></text>
    <text x="26" y="196" fill="#CE8A78" font-size="11" style="font-family: var(--font-sans, Inter, sans-serif)">→ Function copies value 100</text>
    <text x="26" y="222" fill="#8E887D" font-size="11" font-weight="bold" style="font-family: var(--font-sans, Inter, sans-serif)">Original fuel UNCHANGED (100)</text>
  </g>

  <!-- Card 2: Pass by Reference -->
  <g transform="translate(308, 52)">
    <rect width="264" height="264" rx="8" fill="#151A22" stroke="#7FB3A3" stroke-width="1.5" />
    <text x="16" y="26" fill="#7FB3A3" font-size="11" letter-spacing="1.1" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">2. BY REFERENCE: int &amp;x</text>
    
    <rect x="16" y="42" width="232" height="90" rx="4" fill="#1E2530" stroke="#7FB3A3" stroke-width="1.5" />
    <text x="26" y="66" fill="#D8D0C2" font-size="12" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">void burn(<tspan fill="#7FB3A3" font-weight="bold">int &amp;x</tspan>) {</text>
    <text x="44" y="88" fill="#D8D0C2" font-size="12" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">x -= 20; // direct</text>
    <text x="26" y="110" fill="#D8D0C2" font-size="12" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">}</text>

    <!-- Visual Memory Box -->
    <rect x="16" y="146" width="232" height="100" rx="4" fill="#1A202A" stroke="#7FB3A3" stroke-width="1" />
    <text x="26" y="172" fill="#D8D0C2" font-size="11" style="font-family: var(--font-sans, Inter, sans-serif)">main: <tspan fill="#7FB3A3" font-weight="bold">fuel = 100</tspan></text>
    <text x="26" y="196" fill="#7FB3A3" font-size="11" style="font-family: var(--font-sans, Inter, sans-serif)">→ x is an alias for fuel</text>
    <text x="26" y="222" fill="#7FB3A3" font-size="11" font-weight="bold" style="font-family: var(--font-sans, Inter, sans-serif)">Original fuel UPDATED to 80!</text>
  </g>

  <!-- Card 3: Pass by Const Reference -->
  <g transform="translate(592, 52)">
    <rect width="264" height="264" rx="8" fill="#151A22" stroke="#82AAFF" stroke-width="1.5" />
    <text x="16" y="26" fill="#82AAFF" font-size="11" letter-spacing="1.1" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">3. CONST REF: const T &amp;</text>
    
    <rect x="16" y="42" width="232" height="90" rx="4" fill="#1E2530" stroke="#82AAFF" stroke-width="1.5" />
    <text x="26" y="66" fill="#D8D0C2" font-size="11" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">void scan(<tspan fill="#82AAFF" font-weight="bold">const vector&lt;int&gt; &amp;v</tspan>) {</text>
    <text x="44" y="88" fill="#D8D0C2" font-size="11" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">cout &lt;&lt; v.size();</text>
    <text x="26" y="110" fill="#D8D0C2" font-size="11" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">}</text>

    <!-- Visual Memory Box -->
    <rect x="16" y="146" width="232" height="100" rx="4" fill="#1A202A" stroke="#82AAFF" stroke-width="1" />
    <text x="26" y="172" fill="#D8D0C2" font-size="11" style="font-family: var(--font-sans, Inter, sans-serif)">Speed: <tspan fill="#82AAFF" font-weight="bold">Zero copy overhead</tspan></text>
    <text x="26" y="196" fill="#D8D0C2" font-size="11" style="font-family: var(--font-sans, Inter, sans-serif)">Safety: <tspan fill="#CE8A78" font-weight="bold">Read-only protection</tspan></text>
    <text x="26" y="222" fill="#82AAFF" font-size="11" font-weight="bold" style="font-family: var(--font-sans, Inter, sans-serif)">Ideal for vectors &amp; big data</text>
  </g>
</svg>
