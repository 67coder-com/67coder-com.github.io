<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <!-- Background Vault Gradients -->
    <linearGradient id="vaultBg29" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D15"/>
      <stop offset="50%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#080B10"/>
    </linearGradient>

    <linearGradient id="amberStorage29" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B99A61"/>
      <stop offset="100%" stop-color="#E5C78A"/>
    </linearGradient>

    <linearGradient id="cyanStorage29" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C9482"/>
      <stop offset="100%" stop-color="#7FB3A3"/>
    </linearGradient>

    <filter id="glow29" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#vaultBg29)"/>

  <!-- Vault Wall Plates & Structural Ribs -->
  <g stroke="#1D2838" stroke-width="1.5" opacity="0.65">
    <line x1="80" y1="0" x2="80" y2="540"/>
    <line x1="880" y1="0" x2="880" y2="540"/>
    <line x1="0" y1="120" x2="960" y2="120"/>
    <line x1="0" y1="420" x2="960" y2="420"/>
  </g>

  <!-- Central Solid-State Blackbox Flight Memory Core -->
  <g transform="translate(180, 80)">
    <!-- Armored Enclosure -->
    <rect x="0" y="0" width="450" height="320" rx="16" fill="#101826" stroke="#364E68" stroke-width="2.5" filter="url(#glow29)"/>
    <rect x="12" y="12" width="426" height="296" rx="12" fill="none" stroke="#223447" stroke-width="1.2" stroke-dasharray="6 4"/>

    <!-- Persistent Storage Bank 1: Flight Log (flight_log.txt) -->
    <g transform="translate(35, 35)">
      <rect width="380" height="65" rx="8" fill="#162333" stroke="#B99A61" stroke-width="1.5"/>
      <rect x="16" y="16" width="34" height="34" rx="6" fill="#243445" stroke="#B99A61"/>
      <rect x="23" y="24" width="20" height="18" rx="2" fill="#D1B784"/>
      <!-- Abstract Data Track Lines -->
      <rect x="65" y="20" width="130" height="10" rx="2" fill="#D1B784"/>
      <rect x="65" y="38" width="210" height="8" rx="2" fill="#E4DCDB" opacity="0.75"/>
      <!-- Status Light -->
      <circle cx="345" cy="32" r="6" fill="#7FB3A3" filter="url(#glow29)"/>
    </g>

    <!-- Persistent Storage Bank 2: Waypoint Map (route.txt) -->
    <g transform="translate(35, 125)">
      <rect width="380" height="65" rx="8" fill="#162333" stroke="#4C9482" stroke-width="1.5"/>
      <rect x="16" y="16" width="34" height="34" rx="6" fill="#1B3130" stroke="#4C9482"/>
      <circle cx="33" cy="33" r="8" fill="#7FB3A3"/>
      <rect x="65" y="20" width="160" height="10" rx="2" fill="#7FB3A3"/>
      <rect x="65" y="38" width="180" height="8" rx="2" fill="#E4DCDB" opacity="0.75"/>
      <circle cx="345" cy="32" r="6" fill="#D1B784" filter="url(#glow29)"/>
    </g>

    <!-- Persistent Storage Bank 3: Telemetry Archive (telemetry.dat) -->
    <g transform="translate(35, 215)">
      <rect width="380" height="65" rx="8" fill="#162333" stroke="#B99A61" stroke-width="1.5"/>
      <rect x="16" y="16" width="34" height="34" rx="6" fill="#243445" stroke="#B99A61"/>
      <polygon points="26,38 33,24 40,38" fill="#D1B784"/>
      <rect x="65" y="20" width="110" height="10" rx="2" fill="#D1B784"/>
      <rect x="65" y="38" width="240" height="8" rx="2" fill="#E4DCDB" opacity="0.75"/>
      <circle cx="345" cy="32" r="6" fill="#7FB3A3" filter="url(#glow29)"/>
    </g>
  </g>

  <!-- Floor Base -->
  <polygon points="40,430 920,430 960,540 0,540" fill="#0C111A" stroke="#1F2C3F" stroke-width="2"/>
  <line x1="240" y1="430" x2="200" y2="540" stroke="#1A2535" stroke-width="3"/>
  <line x1="720" y1="430" x2="760" y2="540" stroke="#1A2535" stroke-width="3"/>

  <!-- Robot Mascot IRIS [ o o ] Operating the Storage Console -->
  <g transform="translate(700, 220)">
    <!-- Shadow -->
    <ellipse cx="65" cy="205" rx="55" ry="16" fill="#030508" opacity="0.85"/>

    <!-- Chassis Body -->
    <rect x="25" y="90" width="80" height="90" rx="16" fill="#1C2638" stroke="#3A4D6B" stroke-width="2.5"/>
    <rect x="42" y="110" width="46" height="26" rx="6" fill="#0C131D" stroke="#2B3C54" stroke-width="1.5"/>
    <circle cx="53" cy="123" r="4" fill="#7FB3A3"/>
    <circle cx="65" cy="123" r="4" fill="#D1B784"/>
    <circle cx="77" cy="123" r="4" fill="#7FB3A3"/>

    <!-- Neck Connector -->
    <rect x="52" y="75" width="26" height="18" rx="4" fill="#2E3C52"/>

    <!-- Head Unit -->
    <rect x="10" y="10" width="110" height="72" rx="22" fill="#243145" stroke="#485F84" stroke-width="3"/>
    
    <!-- Visor -->
    <rect x="22" y="24" width="86" height="44" rx="14" fill="#090E17" stroke="#1D293D" stroke-width="2"/>

    <!-- Horizontal Pill Eyes [ o o ] -->
    <rect x="36" y="36" width="22" height="18" rx="8" fill="#7FB3A3" filter="url(#glow29)"/>
    <rect x="72" y="36" width="22" height="18" rx="8" fill="#7FB3A3" filter="url(#glow29)"/>
    <circle cx="44" cy="43" r="3" fill="#FFFFFF"/>
    <circle cx="80" cy="43" r="3" fill="#FFFFFF"/>

    <!-- Antenna -->
    <line x1="65" y1="10" x2="65" y2="-12" stroke="#485F84" stroke-width="4" stroke-linecap="round"/>
    <circle cx="65" cy="-16" r="6" fill="#D1B784" filter="url(#glow29)"/>

    <!-- Arm connecting to memory bay -->
    <path d="M 25 115 Q -30 130 -50 90" fill="none" stroke="#2E3C52" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-52" cy="90" r="7" fill="#D1B784"/>
  </g>
</svg>
