<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <!-- Storm Atmosphere Gradients -->
    <linearGradient id="stormSky30" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#120A10"/>
      <stop offset="40%" stop-color="#24141A"/>
      <stop offset="80%" stop-color="#5A241C"/>
      <stop offset="100%" stop-color="#8E3C25"/>
    </linearGradient>

    <!-- Cockpit Hull Gradient -->
    <linearGradient id="cockpitHull30" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121A"/>
      <stop offset="60%" stop-color="#141924"/>
      <stop offset="100%" stop-color="#0A0D14"/>
    </linearGradient>

    <filter id="glow30" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outside Martian Dust Storm Window View -->
  <rect width="960" height="540" fill="url(#stormSky30)"/>

  <!-- Dust Storm Swirls & Lightning Sparks -->
  <path d="M 0 160 Q 240 110 480 180 T 960 140 L 960 380 L 0 380 Z" fill="#69281C" opacity="0.6"/>
  <path d="M 0 240 Q 320 190 640 260 T 960 220 L 960 410 L 0 410 Z" fill="#441712" opacity="0.8"/>
  <!-- Static Lightning Discharge Arc in Storm -->
  <path d="M 520 80 L 505 130 L 530 145 L 490 220 L 515 235 L 475 310" fill="none" stroke="#E5C78A" stroke-width="2.5" filter="url(#glow30)" opacity="0.85"/>
  <path d="M 280 100 L 270 140 L 290 155 L 265 210" fill="none" stroke="#7FB3A3" stroke-width="1.8" filter="url(#glow30)" opacity="0.7"/>

  <!-- Cockpit Frame Frame -->
  <path d="M 0 0 L 960 0 L 960 540 L 0 540 Z M 60 45 L 900 45 L 900 410 L 60 410 Z" fill="url(#cockpitHull30)"/>
  <line x1="320" y1="45" x2="290" y2="410" stroke="#1D2433" stroke-width="12"/>
  <line x1="640" y1="45" x2="670" y2="410" stroke="#1D2433" stroke-width="12"/>

  <!-- Lower Avionics Desk -->
  <polygon points="0,410 960,410 960,540 0,540" fill="#10151E" stroke="#253040" stroke-width="2"/>

  <!-- Holographic Fault Isolation Matrix Console -->
  <g transform="translate(150, 110)">
    <!-- Base Plate -->
    <rect width="450" height="260" rx="12" fill="#0C1522" fill-opacity="0.9" stroke="#3D5A7A" stroke-width="2" filter="url(#glow30)"/>

    <!-- Channel 1: Healthy (Green/Cyan) -->
    <g transform="translate(25, 25)">
      <rect width="400" height="45" rx="6" fill="#132321" stroke="#3F6B60" stroke-width="1.2"/>
      <rect x="15" y="16" width="60" height="12" rx="3" fill="#7FB3A3"/>
      <rect x="110" y="16" width="120" height="12" rx="3" fill="#E4DCDB" opacity="0.8"/>
      <circle cx="370" cy="22" r="7" fill="#7FB3A3" filter="url(#glow30)"/>
    </g>

    <!-- Channel 2: Corrupted & Isolated (Red/Amber Alert Handled!) -->
    <g transform="translate(25, 80)">
      <rect width="400" height="45" rx="6" fill="#2E1B1D" stroke="#D9634D" stroke-width="1.8"/>
      <rect x="15" y="16" width="60" height="12" rx="3" fill="#F09B8B"/>
      <!-- Strike-through / Warning Glyph -->
      <line x1="100" y1="22" x2="230" y2="22" stroke="#D9634D" stroke-width="3" stroke-dasharray="4 4"/>
      <polygon points="360,30 370,12 380,30" fill="#E5C78A" filter="url(#glow30)"/>
    </g>

    <!-- Channel 3: Backup Redundancy Engaged (Gold) -->
    <g transform="translate(25, 135)">
      <rect width="400" height="45" rx="6" fill="#292218" stroke="#B99A61" stroke-width="1.5"/>
      <rect x="15" y="16" width="75" height="12" rx="3" fill="#D1B784"/>
      <rect x="120" y="16" width="140" height="12" rx="3" fill="#E4DCDB" opacity="0.8"/>
      <circle cx="370" cy="22" r="7" fill="#D1B784" filter="url(#glow30)"/>
    </g>

    <!-- Status Bar: System Recalibrated & Stable -->
    <g transform="translate(25, 195)">
      <rect width="400" height="40" rx="6" fill="#15242A" stroke="#4C9482" stroke-width="1.5"/>
      <rect x="20" y="14" width="180" height="12" rx="3" fill="#7FB3A3"/>
      <rect x="330" y="14" width="50" height="12" rx="3" fill="#D1B784"/>
    </g>
  </g>

  <!-- Robot Mascot IRIS [ o o ] Operating Recovery Console -->
  <g transform="translate(710, 240)">
    <!-- Shadow -->
    <ellipse cx="65" cy="180" rx="55" ry="16" fill="#030508" opacity="0.85"/>

    <!-- Chassis Body -->
    <rect x="25" y="75" width="80" height="85" rx="16" fill="#1C2638" stroke="#3A4D6B" stroke-width="2.5"/>
    <rect x="42" y="95" width="46" height="24" rx="6" fill="#0B121C" stroke="#2B3C54" stroke-width="1.5"/>
    <circle cx="53" cy="107" r="4" fill="#7FB3A3"/>
    <circle cx="65" cy="107" r="4" fill="#D1B784"/>
    <circle cx="77" cy="107" r="4" fill="#7FB3A3"/>

    <!-- Neck Connector -->
    <rect x="52" y="60" width="26" height="18" rx="4" fill="#2E3C52"/>

    <!-- Head Unit (Rounded Cube) -->
    <rect x="10" y="-5" width="110" height="72" rx="22" fill="#243145" stroke="#485F84" stroke-width="3"/>
    
    <!-- Visor -->
    <rect x="22" y="9" width="86" height="44" rx="14" fill="#090E17" stroke="#1D293D" stroke-width="2"/>

    <!-- Horizontal Pill Eyes [ o o ] Steady and Calm -->
    <rect x="36" y="21" width="22" height="18" rx="8" fill="#7FB3A3" filter="url(#glow30)"/>
    <rect x="72" y="21" width="22" height="18" rx="8" fill="#7FB3A3" filter="url(#glow30)"/>
    <circle cx="44" cy="28" r="3" fill="#FFFFFF"/>
    <circle cx="80" cy="28" r="3" fill="#FFFFFF"/>

    <!-- Antenna -->
    <line x1="65" y1="-5" x2="65" y2="-25" stroke="#485F84" stroke-width="4" stroke-linecap="round"/>
    <circle cx="65" cy="-29" r="6" fill="#D1B784" filter="url(#glow30)"/>

    <!-- Arm resetting error switch -->
    <path d="M 25 100 Q -25 115 -45 80" fill="none" stroke="#2E3C52" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-47" cy="80" r="7" fill="#7FB3A3"/>
  </g>
</svg>
