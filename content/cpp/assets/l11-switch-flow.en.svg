<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <title>C++ switch control flow: break vs fall-through</title>
  <desc>Diagram illustrating switch statement control flow. Left panel shows correct execution with break exiting the block cleanly. Right panel shows a bug with missing break causing execution to fall through into the next case.</desc>

  <!-- Background -->
  <rect width="880" height="320" rx="10" fill="#0D1117" />

  <!-- Header -->
  <text x="24" y="34" fill="#8E887D" font-size="12" letter-spacing="1.6" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">SWITCH CONTROL FLOW: BREAK; VS FALL-THROUGH</text>

  <!-- Left panel: Correct with break; -->
  <g transform="translate(24, 52)">
    <rect width="404" height="244" rx="8" fill="#151A22" stroke="#7FB3A3" stroke-width="1.5" />
    <text x="20" y="28" fill="#7FB3A3" font-size="11" letter-spacing="1.2" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">1. CORRECT: CASE ENDS WITH BREAK;</text>

    <!-- Code block -->
    <rect x="20" y="44" width="364" height="136" rx="4" fill="#1E2530" stroke="#2A313C" stroke-width="1" />
    <text x="35" y="70" fill="#D8D0C2" font-size="14" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)"><tspan fill="#D1B784">case</tspan> <tspan fill="#A9B79B">'S'</tspan>:</text>
    <text x="55" y="92" fill="#D8D0C2" font-size="14" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">cout &lt;&lt; <tspan fill="#A9B79B">"SURVEY"</tspan>;</text>
    <rect x="50" y="102" width="76" height="24" rx="3" fill="#151A22" stroke="#7FB3A3" stroke-width="1.5" />
    <text x="58" y="118" fill="#7FB3A3" font-size="14" font-weight="bold" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">break;</text>
    <text x="35" y="146" fill="#8E887D" font-size="14" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)"><tspan fill="#8E887D">case</tspan> 'L': ...</text>

    <!-- Flow arrow out -->
    <path d="M 135 114 L 330 114 L 330 200" fill="none" stroke="#7FB3A3" stroke-width="2" />
    <polygon points="330,204 325,194 335,194" fill="#7FB3A3" />
    <text x="180" y="106" fill="#7FB3A3" font-size="11" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">EXITS SWITCH →</text>

    <!-- Result -->
    <rect x="20" y="196" width="364" height="34" rx="4" fill="#1E2530" stroke="#2A313C" stroke-width="1" />
    <text x="35" y="218" fill="#D8D0C2" font-size="13" style="font-family: var(--font-sans, Inter, sans-serif)">Output: <tspan fill="#7FB3A3" font-weight="bold" font-family="monospace">SURVEY</tspan> (only intended action)</text>
  </g>

  <!-- Right panel: Bug with missing break (fall-through) -->
  <g transform="translate(452, 52)">
    <rect width="404" height="244" rx="8" fill="#151A22" stroke="#CE8A78" stroke-width="1.5" />
    <text x="20" y="28" fill="#CE8A78" font-size="11" letter-spacing="1.2" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">2. BUG: MISSING BREAK; (FALL-THROUGH)</text>

    <!-- Code block -->
    <rect x="20" y="44" width="364" height="136" rx="4" fill="#1E2530" stroke="#2A313C" stroke-width="1" />
    <text x="35" y="70" fill="#D8D0C2" font-size="14" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)"><tspan fill="#D1B784">case</tspan> <tspan fill="#A9B79B">'S'</tspan>:</text>
    <text x="55" y="92" fill="#D8D0C2" font-size="14" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">cout &lt;&lt; <tspan fill="#A9B79B">"SURVEY"</tspan>;</text>
    <text x="55" y="112" fill="#CE8A78" font-size="12" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">// missing break!</text>
    <text x="35" y="136" fill="#CE8A78" font-size="14" font-weight="bold" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)"><tspan fill="#CE8A78">case</tspan> 'L':</text>
    <text x="55" y="158" fill="#CE8A78" font-size="14" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">cout &lt;&lt; "LIDAR";</text>

    <!-- Fall-through arrow down -->
    <line x1="28" y1="94" x2="28" y2="148" stroke="#CE8A78" stroke-width="2.5" stroke-dasharray="3" />
    <polygon points="28,152 23,142 33,142" fill="#CE8A78" />
    <text x="300" y="114" text-anchor="middle" fill="#CE8A78" font-size="11" style="font-family: var(--font-mono, 'JetBrains Mono', monospace)">FALLS THROUGH ↓</text>

    <!-- Result -->
    <rect x="20" y="196" width="364" height="34" rx="4" fill="#1E2530" stroke="#2A313C" stroke-width="1" />
    <text x="35" y="218" fill="#CE8A78" font-size="13" style="font-family: var(--font-sans, Inter, sans-serif)">Output: <tspan font-weight="bold" font-family="monospace">SURVEYLIDAR</tspan> (unintended!)</text>
  </g>
</svg>
