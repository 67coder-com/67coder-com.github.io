<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad27" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#141B26"/>
    </linearGradient>
    <linearGradient id="headerGrad27" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B99A61"/>
      <stop offset="100%" stop-color="#D1B784"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="840" height="440" rx="12" fill="url(#bgGrad27)" stroke="#232E3F" stroke-width="2"/>

  <!-- Title Banner -->
  <text x="40" y="44" fill="url(#headerGrad27)" font-family="system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="1.2">C++ struct ARCHITECTURE &amp; MEMORY LAYOUT</text>
  <text x="40" y="68" fill="#8E9DAE" font-family="system-ui, sans-serif" font-size="13">Composite user-defined types: member variables, dot operator '.', and the mandatory trailing semicolon</text>

  <!-- Left Card: Declaration & Semicolon Rule -->
  <g transform="translate(40, 95)">
    <rect width="360" height="185" rx="8" fill="#151C28" stroke="#2D3B4E" stroke-width="1.5"/>
    <rect x="0" y="0" width="360" height="32" rx="8" fill="#1B2536"/>
    <text x="14" y="22" fill="#D1B784" font-family="monospace" font-size="13" font-weight="bold">1. STRUCT DECLARATION</text>

    <!-- Code Block -->
    <text x="14" y="58" fill="#7FB3A3" font-family="monospace" font-size="13">struct Drone {</text>
    <text x="32" y="78" fill="#E4DCDB" font-family="monospace" font-size="13">int id;</text>
    <text x="160" y="78" fill="#6B7A99" font-family="sans-serif" font-size="11">// 4 bytes</text>
    <text x="32" y="98" fill="#E4DCDB" font-family="monospace" font-size="13">int battery;</text>
    <text x="160" y="98" fill="#6B7A99" font-family="sans-serif" font-size="11">// 4 bytes</text>
    <text x="32" y="118" fill="#E4DCDB" font-family="monospace" font-size="13">double altitude;</text>
    <text x="160" y="118" fill="#6B7A99" font-family="sans-serif" font-size="11">// 8 bytes</text>
    <text x="14" y="140" fill="#7FB3A3" font-family="monospace" font-size="13">}</text>
    
    <!-- Critical Semicolon Highlight -->
    <rect x="23" y="126" width="18" height="20" rx="3" fill="#2E1B1D" stroke="#D9634D" stroke-width="1.5"/>
    <text x="27" y="141" fill="#F09B8B" font-family="monospace" font-size="16" font-weight="bold">;</text>
    <text x="50" y="140" fill="#F09B8B" font-family="sans-serif" font-size="11" font-weight="bold">← MANDATORY SEMICOLON!</text>

    <text x="14" y="168" fill="#D1B784" font-family="monospace" font-size="11">Drone d = {1, 95, 42.5}; // Instantiation</text>
  </g>

  <!-- Right Card: Contiguous Memory Layout -->
  <g transform="translate(440, 95)">
    <rect width="360" height="185" rx="8" fill="#151C28" stroke="#2D3B4E" stroke-width="1.5"/>
    <rect x="0" y="0" width="360" height="32" rx="8" fill="#1B2536"/>
    <text x="14" y="22" fill="#7FB3A3" font-family="monospace" font-size="13" font-weight="bold">2. CONTIGUOUS MEMORY (16 BYTES)</text>

    <!-- Memory Boxes -->
    <g transform="translate(14, 52)">
      <!-- id (4 bytes) -->
      <rect x="0" y="0" width="90" height="54" rx="4" fill="#1D2A3A" stroke="#37526D"/>
      <text x="45" y="24" fill="#D1B784" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">.id</text>
      <text x="45" y="42" fill="#8E9DAE" font-family="sans-serif" font-size="10" text-anchor="middle">4 bytes (int)</text>

      <!-- battery (4 bytes) -->
      <rect x="94" y="0" width="90" height="54" rx="4" fill="#1D2A3A" stroke="#37526D"/>
      <text x="139" y="24" fill="#D1B784" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">.battery</text>
      <text x="139" y="42" fill="#8E9DAE" font-family="sans-serif" font-size="10" text-anchor="middle">4 bytes (int)</text>

      <!-- altitude (8 bytes) -->
      <rect x="188" y="0" width="144" height="54" rx="4" fill="#1B3330" stroke="#3F6B60"/>
      <text x="260" y="24" fill="#7FB3A3" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">.altitude</text>
      <text x="260" y="42" fill="#8E9DAE" font-family="sans-serif" font-size="10" text-anchor="middle">8 bytes (double)</text>
    </g>

    <text x="14" y="132" fill="#8E9DAE" font-family="sans-serif" font-size="11">Total contiguous size: <tspan fill="#D1B784" font-weight="bold">sizeof(Drone) == 16 bytes</tspan></text>
    <text x="14" y="152" fill="#8E9DAE" font-family="sans-serif" font-size="11">Member access syntax: <tspan fill="#7FB3A3" font-family="monospace">d.battery -= 10;</tspan></text>
    <text x="14" y="170" fill="#6B7A99" font-family="sans-serif" font-size="11">Fields are stored sequentially, enabling bulk operations.</text>
  </g>

  <!-- Bottom Section: Passing Structs to Functions -->
  <g transform="translate(40, 300)">
    <rect width="760" height="115" rx="8" fill="#151C28" stroke="#2D3B4E" stroke-width="1.5"/>
    <rect x="0" y="0" width="760" height="30" rx="8" fill="#1B2536"/>
    <text x="14" y="20" fill="#E4DCDB" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">3. FUNCTION CALL SEMANTICS WITH STRUCTS</text>

    <!-- 3 Modes -->
    <g transform="translate(14, 42)">
      <!-- By Value -->
      <rect x="0" y="0" width="232" height="60" rx="6" fill="#1C2433" stroke="#32425A"/>
      <text x="12" y="22" fill="#D1B784" font-family="monospace" font-size="12" font-weight="bold">bool check(Drone d)</text>
      <text x="12" y="40" fill="#8E9DAE" font-family="sans-serif" font-size="10">Pass-by-value: Copies full 16B.</text>
      <text x="12" y="52" fill="#6B7A99" font-family="sans-serif" font-size="10">Caller's object cannot be modified.</text>

      <!-- By Reference -->
      <rect x="250" y="0" width="232" height="60" rx="6" fill="#172A28" stroke="#3F6B60"/>
      <text x="262" y="22" fill="#7FB3A3" font-family="monospace" font-size="12" font-weight="bold">void recharge(Drone &amp;d)</text>
      <text x="262" y="40" fill="#8E9DAE" font-family="sans-serif" font-size="10">Pass-by-reference: Modifies in-place.</text>
      <text x="262" y="52" fill="#7FB3A3" font-family="sans-serif" font-size="10">Direct access to original caller fields.</text>

      <!-- By Const Reference -->
      <rect x="500" y="0" width="232" height="60" rx="6" fill="#1C273B" stroke="#48628C"/>
      <text x="512" y="22" fill="#E4DCDB" font-family="monospace" font-size="12" font-weight="bold">void print(const Drone &amp;d)</text>
      <text x="512" y="40" fill="#8E9DAE" font-family="sans-serif" font-size="10">Pass-by-const-ref: Zero-copy read-only.</text>
      <text x="512" y="52" fill="#B99A61" font-family="sans-serif" font-size="10">Maximum efficiency &amp; read safety.</text>
    </g>
  </g>
</svg>
