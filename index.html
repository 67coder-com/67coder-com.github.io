/* ── Состояние и хранилище ────────────────────────────────── */
var state = { uiLang: DEFAULT_LANG, contentLang: DEFAULT_LANG };
var cache = { catalog: null, structure: {}, texts: {}, lessons: {}, lessonTexts: {}, svgs: {} };
var renderToken = 0;

function readStored(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function writeStored(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

/* Прогресс хранится по курсу, без локали: пройденный урок
   остаётся пройденным, на каком бы языке его ни открыли. */
function doneList(courseId) {
  var raw = readStored("progress." + courseId + ".done");
  if (!raw) return [];
  try {
    var parsed = JSON.parse(raw);
    return Object.prototype.toString.call(parsed) === "[object Array]" ? parsed : [];
  } catch (e) { return []; }
}
function isDone(courseId, n) { return doneList(courseId).indexOf(n) !== -1; }
function toggleDone(courseId, n) {
  var list = doneList(courseId);
  var at = list.indexOf(n);
  if (at === -1) list.push(n); else list.splice(at, 1);
  list.sort(function (a, b) { return a - b; });
  writeStored("progress." + courseId + ".done", JSON.stringify(list));
}

function knownLang(code) {
  for (var i = 0; i < LANGS.length; i++) { if (LANGS[i].code === code) return true; }
  return false;
}
function t(key) {
  var dict = UI[state.uiLang] || UI[DEFAULT_LANG];
  return dict[key] !== undefined ? dict[key] : key;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function langLabel(code) {
  for (var i = 0; i < LANGS.length; i++) { if (LANGS[i].code === code) return LANGS[i].label; }
  return code;
}

/* ── Загрузка данных ──────────────────────────────────────── */
function getJSON(url) {
  return fetch(url, { cache: "no-cache" }).then(function (r) {
    if (!r.ok) throw new Error(url + " → " + r.status);
    return r.json();
  });
}

function loadCatalog() {
  if (cache.catalog) return Promise.resolve(cache.catalog);
  return getJSON(CONTENT + "courses.json").then(function (data) {
    cache.catalog = data.courses || [];
    /* Для доступных курсов сразу тянем структуру: из неё
       считаются бейджи языков и число уроков. */
    var live = cache.catalog.filter(function (c) { return c.status === "live"; });
    return Promise.all(live.map(function (c) { return loadStructure(c.id); }))
      .then(function () { return cache.catalog; });
  });
}

function loadStructure(courseId) {
  if (cache.structure[courseId]) return Promise.resolve(cache.structure[courseId]);
  return getJSON(CONTENT + courseId + "/course.json").then(function (data) {
    var n = 0;
    var flat = [];
    (data.modules || []).forEach(function (m) {
      (m.lessons || []).forEach(function (l) { n += 1; flat.push(l); });
    });
    data.flat = flat;
    data.lessons = n;
    cache.structure[courseId] = data;
    return data;
  });
}

function loadTexts(courseId, lang) {
  var key = courseId + "." + lang;
  if (cache.texts[key]) return Promise.resolve(cache.texts[key]);
  return getJSON(CONTENT + courseId + "/course." + lang + ".json").then(function (data) {
    cache.texts[key] = data;
    return data;
  });
}

function findCourse(id) {
  if (!cache.catalog) return null;
  for (var i = 0; i < cache.catalog.length; i++) { if (cache.catalog[i].id === id) return cache.catalog[i]; }
  return null;
}
function findLesson(courseId, n) {
  var s = cache.structure[courseId];
  if (!s) return null;
  for (var i = 0; i < s.flat.length; i++) { if (s.flat[i].n === Number(n)) return s.flat[i]; }
  return null;
}
function translatedCount(courseId, code) {
  var s = cache.structure[courseId];
  if (!s) return 0;
  var count = 0;
  for (var i = 0; i < s.flat.length; i++) { if (s.flat[i].locales.indexOf(code) !== -1) count += 1; }
  return count;
}
function courseLocales(courseId) {
  var out = [];
  for (var i = 0; i < LANGS.length; i++) {
    if (translatedCount(courseId, LANGS[i].code) > 0) out.push(LANGS[i].code);
  }
  return out;
}
function lessonCount(courseId) {
  var s = cache.structure[courseId];
  return s ? s.lessons : 0;
}

/* ── Маршрутизация ────────────────────────────────────────── */
function parseHash() {
  var raw = (location.hash || "").replace(/^#\/?/, "");
  var parts = raw.split("/").filter(Boolean);

  if (!parts.length || parts[0] === "catalog") return { screen: "catalog" };

  if (parts[0] === "course" && parts[1]) {
    return {
      screen: "course",
      course: parts[1],
      lang: parts[2] || null,
      lesson: parts[3] === "lesson" ? parts[4] || null : null,
      step: parts[3] === "lesson" ? parts[5] || null : null,
      module: parts[3] === "module" ? parts[4] || null : null,
      print: parts[3] === "print" ? parts[4] || null : null
    };
  }
  return { screen: "catalog" };
}

function moduleHash(courseId, lang, moduleId) {
  return "#/course/" + courseId + "/" + lang + "/module/" + moduleId;
}

function findModule(courseId, n) {
  var st = cache.structure[courseId];
  if (!st) return null;
  for (var m = 0; m < st.modules.length; m++) {
    var ls = st.modules[m].lessons;
    for (var i = 0; i < ls.length; i++) { if (ls[i].n === Number(n)) return st.modules[m]; }
  }
  return null;
}

function moduleName(courseId, mod) {
  var texts = cache.texts[courseId + "." + state.uiLang] || cache.texts[courseId + "." + state.contentLang];
  var name = texts && texts.modules ? texts.modules[mod.id] : null;
  return name || mod.id;
}

function courseHash(courseId, lang, lesson, step) {
  var hash = "#/course/" + courseId + "/" + lang;
  if (lesson) hash += "/lesson/" + lesson + (step ? "/" + step : "");
  return hash;
}

function resolveCourseLang(course, wanted) {
  var available = courseLocales(course.id);
  if (!available.length) return { lang: course.defaultLang, fellBack: false };
  if (wanted && available.indexOf(wanted) !== -1) return { lang: wanted, fellBack: false };
  var fallback = available.indexOf(course.defaultLang) !== -1 ? course.defaultLang : available[0];
  return { lang: fallback, fellBack: true };
}

/* ── Общие куски разметки ─────────────────────────────────── */
function markSvg(eyeColour, pupilColour, ringColour, sleeping) {
  var ring = ' stroke="' + ringColour + '" stroke-width="4"';
  var eyes = sleeping
    ? '<path d="M 83 118 L 111 118" fill="none" stroke="' + eyeColour + '" stroke-width="8" stroke-linecap="round"></path>' +
      '<path d="M 129 118 L 157 118" fill="none" stroke="' + eyeColour + '" stroke-width="8" stroke-linecap="round"></path>'
    : '<circle cx="97" cy="118" r="18" fill="' + eyeColour + '"' + ring + '></circle>' +
      '<circle cx="143" cy="118" r="18" fill="' + eyeColour + '"' + ring + '></circle>' +
      '<circle cx="101" cy="121" r="7.5" fill="' + pupilColour + '"></circle>' +
      '<circle cx="147" cy="121" r="7.5" fill="' + pupilColour + '"></circle>';

  return '<path d="M 86 56 L 62 56 L 62 184 L 86 184" fill="none" stroke="currentColor" stroke-width="10"></path>' +
         '<path d="M 154 56 L 178 56 L 178 184 L 154 184" fill="none" stroke="currentColor" stroke-width="10"></path>' +
         eyes;
}

function header() {
  var options = LANGS.map(function (l) {
    return '<option value="' + l.code + '"' + (l.code === state.uiLang ? " selected" : "") + ">" + esc(l.label) + "</option>";
  }).join("");

  var themeLabel = document.documentElement.getAttribute("data-theme") === "light" ? t("themeToDark") : t("themeToLight");

  return '<div class="sticky"><header class="top">' +
      '<a class="brand" href="#/catalog">' +
        '<svg viewBox="51 45 138 150" role="img" aria-label="67coder" style="color: var(--ink-muted)">' +
          markSvg("var(--eye-milk)", "var(--eye-pupil)", "var(--eye-ring)", false) +
        "</svg>" +
        '<span class="wordmark">[<b>67</b>]<i>coder</i></span>' +
      "</a>" +
      '<nav class="headlinks" aria-label="' + esc(t("navLabel")) + '">' +
        '<a href="#/catalog">' + esc(t("allCourses")) + "</a>" +
        '<label class="visually-hidden" for="langpick">' + esc(t("langLabel")) + "</label>" +
        '<select class="langpick" id="langpick">' + options + "</select>" +
        '<button type="button" class="btn small" id="themeBtn">' + esc(themeLabel) + "</button>" +
      "</nav>" +
    "</header></div>";
}

function footer() {
  return '<footer class="foot"><span>' + esc(t("footerNote")) + "</span><span>67coder.com</span></footer>";
}

function crumbs(course, lang, mod) {
  var out = '<div class="crumbs"><a class="crumb" href="' + courseHash(course.id, lang, null, null) + '">' +
    backArrow() + esc(course.title[state.uiLang]) + "</a>";
  if (mod) {
    out += '<span class="sep">·</span><a class="crumb" href="' + moduleHash(course.id, lang, mod.id) + '">' +
      esc(moduleName(course.id, mod)) + "</a>";
  }
  return out + "</div>";
}

function chevron() {
  return '<svg class="chev" viewBox="0 0 8 13" aria-hidden="true">' +
    '<path d="M1 1 L7 6.5 L1 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
}
function backArrow() {
  return '<svg viewBox="0 0 8 13" aria-hidden="true" style="width: 7px; height: 11px; transform: rotate(180deg)">' +
    '<path d="M1 1 L7 6.5 L1 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
}
function tick() {
  return '<span class="tick" aria-hidden="true"><svg viewBox="0 0 11 9">' +
    '<path d="M1 4.6 L4 7.6 L10 1.4" fill="none" stroke="var(--success)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>' +
    "</svg></span>";
}

function badges(courseId) {
  var available = courseLocales(courseId);
  if (!available.length) return "";
  var total = lessonCount(courseId);
  return '<div class="badges">' + available.map(function (code) {
    var done = translatedCount(courseId, code);
    var partial = done < total;
    return '<span class="badge' + (partial ? " partial" : "") + '">' +
      code.toUpperCase() + (partial ? " " + done + "/" + total : "") + "</span>";
  }).join("") + "</div>";
}

/* ── Экран: каталог ───────────────────────────────────────── */
function courseCard(course) {
  var live = course.status === "live";
  var target = live ? courseHash(course.id, resolveCourseLang(course, state.uiLang).lang, null, null) : null;

  var mark = live
    ? markSvg("var(--accent)", "var(--surface-sunken)", "transparent", false)
    : markSvg("var(--ink-faint)", "var(--surface-sunken)", "transparent", true);

  var head = live
    ? '<a class="cover" href="' + target + '" aria-label="' + esc(t("openCourse")) + ": " + esc(course.title[state.uiLang]) + '">'
    : '<div class="cover">';

  var body = live
    ? '<div class="meta"><span class="status live">' + esc(t("statusLive")) + "</span>" + badges(course.id) + "</div>" +
      '<div class="meta-mono">' + lessonCount(course.id) + " " + esc(t("lessonsWord")) + "</div>" +
      '<div class="actions"><a class="btn primary" href="' + target + '">' + esc(t("openCourse")) + "</a></div>"
    : '<div class="actions"><span class="status">' + esc(t("statusPlanned")) + "</span></div>";

  return '<article class="card' + (live ? "" : " planned") + '">' +
    head +
      '<span class="cover-name">' + esc(course.cover) + "</span>" +
      '<svg class="cover-mark" viewBox="51 45 138 150" aria-hidden="true" style="color: ' + (live ? "var(--accent)" : "var(--ink-faint)") + '">' + mark + "</svg>" +
    (live ? "</a>" : "</div>") +
    '<div class="cardbody">' +
      "<h2>" + (live ? '<a href="' + target + '">' : "") + esc(course.title[state.uiLang]) + (live ? "</a>" : "") + "</h2>" +
      '<p class="muted">' + esc(course.summary[state.uiLang]) + "</p>" +
      body +
    "</div></article>";
}

function catalogScreen(courses) {
  return header() +
    '<main class="screen">' +
      '<div class="eyebrow">' + esc(t("catalogEyebrow")) + "</div>" +
      "<h1>" + esc(t("catalogTitle")) + "</h1>" +
      '<p class="lead wide">' + esc(t("catalogLead")) + "</p>" +
      '<div class="cards">' + courses.map(courseCard).join("") + "</div>" +
    "</main>" + footer();
}

/* ── Экран: курс ──────────────────────────────────────────── */
function lessonTitle(courseId, lesson, lang) {
  var has = lesson.locales && lesson.locales.indexOf(lang) !== -1;
  var shown = has || !lesson.locales || !lesson.locales.length ? lang : lesson.locales[0];
  var texts = cache.texts[courseId + "." + shown] || cache.texts[courseId + "." + lang];
  var bySlug = texts && texts.lessons ? texts.lessons[lesson.slug] : null;
  return { text: bySlug || lesson.slug, lang: shown };
}

function lessonRow(courseId, lesson, lang) {
  var num0 = (lesson.n < 10 ? "0" : "") + lesson.n;
  if (!lesson.locales || !lesson.locales.length) {
    var soon = lessonTitle(courseId, lesson, lang);
    return '<div class="lesson soon">' +
      '<span class="lesson-num">' + num0 + "</span>" +
      '<span class="lesson-title" lang="' + soon.lang + '">' + esc(soon.text) + "</span>" +
      '<span class="lesson-state"><span class="badge partial">' + esc(t("soonShort")) + "</span></span>" +
    "</div>";
  }
  var translated = lesson.locales.indexOf(lang) !== -1;
  var done = isDone(courseId, lesson.n);
  var href = courseHash(courseId, lang, lesson.n, null);
  var num = (lesson.n < 10 ? "0" : "") + lesson.n;
  var title = lessonTitle(courseId, lesson, lang);

  var mark = done
    ? tick()
    : (translated ? '<span class="dot" aria-hidden="true"></span>'
                  : '<span class="badge partial">' + esc(t("notTranslatedShort")) + "</span>");

  return '<a class="lesson' + (translated ? "" : " untranslated") + '" href="' + href + '">' +
    '<span class="lesson-num">' + num + "</span>" +
    '<span class="lesson-title" lang="' + title.lang + '">' + esc(title.text) + "</span>" +
    '<span class="lesson-state">' + mark + chevron() + "</span>" +
  "</a>";
}

function moduleBlock(courseId, mod, lang) {
  var doneHere = 0;
  for (var i = 0; i < mod.lessons.length; i++) { if (isDone(courseId, mod.lessons[i].n)) doneHere += 1; }

  var texts = cache.texts[courseId + "." + state.uiLang] || cache.texts[courseId + "." + lang];
  var name = texts && texts.modules ? texts.modules[mod.id] : mod.id;

  return '<section class="module" id="mod-' + esc(mod.id) + '">' +
    '<div class="module-head">' +
      '<div class="module-name">' + esc(name || mod.id) + "</div>" +
      '<div class="meta-mono">' + doneHere + " / " + mod.lessons.length + "</div>" +
    "</div>" +
    '<div class="lessons">' + mod.lessons.map(function (l) { return lessonRow(courseId, l, lang); }).join("") + "</div>" +
  "</section>";
}

function courseScreen(course, resolved) {
  var lang = resolved.lang;
  var structure = cache.structure[course.id];
  var total = structure.lessons;
  var done = doneList(course.id).length;
  var percent = total ? Math.round((done / total) * 100) : 0;

  var ready = structure.flat.filter(function (l) { return l.locales && l.locales.length; });
  var next = null;
  for (var i = 0; i < ready.length; i++) {
    if (!isDone(course.id, ready[i].n)) { next = ready[i]; break; }
  }

  var ctaLabel = done === 0 ? t("startCourse") : (next ? t("continueCourse") : t("repeatCourse"));
  var ctaTarget = courseHash(course.id, lang, (next || ready[0] || structure.flat[0]).n, null);

  var notice = resolved.fellBack
    ? '<div class="notice">' + esc(t("onlyInOther")) + esc(langLabel(lang)) + ".</div>"
    : "";

  var side = '<aside class="hero-side">' +
      '<div class="progress-head"><span><b>' + percent + "%</b></span>" +
        "<span>" + done + " " + esc(t("ofWord")) + " " + total + "</span></div>" +
      '<div class="track" role="progressbar" aria-valuenow="' + done + '" aria-valuemin="0" aria-valuemax="' + total +
        '" aria-label="' + esc(t("progressWord")) + '"><span style="width: ' + percent + '%"></span></div>' +
      '<a class="btn primary" href="' + ctaTarget + '">' + esc(ctaLabel) + "</a>" +
      '<div class="side-facts">' +
        "<div><span>" + esc(t("factLessons")) + "</span><span>" + total + "</span></div>" +
        "<div><span>" + esc(t("factLangs")) + "</span><span>" +
          courseLocales(course.id).map(function (c) { return c.toUpperCase(); }).join(" · ") + "</span></div>" +
      "</div>" +
    "</aside>";

  return header() +
    '<main class="screen">' +
      '<a class="crumb" href="#/catalog">' + backArrow() + esc(t("backToCatalog")) + "</a>" +
      '<div class="hero">' +
        '<div class="hero-main">' +
          '<div class="eyebrow">' + esc(course.cover) + "</div>" +
          "<h1>" + esc(course.title[state.uiLang]) + "</h1>" +
          '<p class="lead">' + esc(course.summary[state.uiLang]) + "</p>" +
          notice +
        "</div>" + side +
      "</div>" +
      structure.modules.map(function (m) { return moduleBlock(course.id, m, lang); }).join("") +
    "</main>" + footer();
}

/* ════════════════════════════════════════════════════════════
   ЭКРАН УРОКА

   Урок — плеер шагов: один шаг на экране, слаг шага в адресе.

   Типы шагов:
     theory    текст
     example   код с подсветкой и разбором
     explain   схема или картинка
     video     ролик
     predict   предскажи вывод, потом сравни
     editor    редактор с запуском (C++ в браузере)
     clickline найди строку с ошибкой
     parsons   собери программу из перемешанных строк
     blanks    заполни пропуски в коде
     quiz      вопрос с вариантами
     summary   итог урока

   У любого шага могут быть раскрывающиеся блоки в texts.more:
     { kind: "archive" | "deeper", title, body, sources }

   Поля code, starter, expected, solution, lines и blanks можно
   переопределить в языковом файле, если вывод программы зависит
   от языка. По умолчанию они берутся из файла структуры.
   ════════════════════════════════════════════════════════════ */

function pad2(n) { return (n < 10 ? "0" : "") + n; }

function loadLesson(courseId, n) {
  var key = courseId + "." + n;
  if (cache.lessons[key]) return Promise.resolve(cache.lessons[key]);
  return getJSON(CONTENT + courseId + "/lesson-" + pad2(n) + ".json").then(function (data) {
    cache.lessons[key] = data;
    return data;
  });
}

function loadLessonTexts(courseId, n, lang) {
  var key = courseId + "." + n + "." + lang;
  if (cache.lessonTexts[key]) return Promise.resolve(cache.lessonTexts[key]);
  return getJSON(CONTENT + courseId + "/lesson-" + pad2(n) + "." + lang + ".json").then(function (data) {
    cache.lessonTexts[key] = data;
    return data;
  });
}

/* ════════════════════════════════════════════════════════════
   ДВИЖОК ЗАПУСКА КОДА — см. runner.worker.js
   ════════════════════════════════════════════════════════════ */
var runner = (function () {
  var worker = null, seq = 0, pending = {};

  function ensure() {
    if (worker) return worker;
    worker = new Worker("runner.worker.js", { type: "module" });
    worker.onmessage = function (e) {
      var msg = e.data || {};
      var job = pending[msg.id];
      if (!job) return;
      if (msg.type === "status") { if (runner.onStatus) runner.onStatus(msg); return; }
      delete pending[msg.id];
      if (msg.type === "done") job.resolve(msg);
      else job.reject(new Error(msg.message || "failed"));
    };
    worker.onerror = function () {
      for (var k in pending) { pending[k].reject(new Error("worker-failed")); delete pending[k]; }
      worker = null;
    };
    return worker;
  }

  return {
    onStatus: null,
    run: function (lang, code, stdin) {
      return new Promise(function (resolve, reject) {
        var id = ++seq;
        pending[id] = { resolve: resolve, reject: reject };
        ensure().postMessage({ id: id, lang: lang, code: code, stdin: stdin });
      });
    },
    /* Остановка — это убийство воркера. Бесконечный цикл студента
       живёт не в странице, поэтому она не зависает. */
    stop: function () {
      if (!worker) return;
      worker.terminate();
      worker = null;
      for (var k in pending) { pending[k].reject(new Error("stopped")); delete pending[k]; }
    }
  };
})();

/* ── Подсветка синтаксиса ─────────────────────────────────── */
var CPP_KEYWORDS = {
  "int": 1, "float": 1, "double": 1, "char": 1, "bool": 1, "void": 1, "auto": 1,
  "const": 1, "static": 1, "unsigned": 1, "long": 1, "short": 1, "struct": 1,
  "class": 1, "public": 1, "private": 1, "return": 1, "if": 1, "else": 1,
  "for": 1, "while": 1, "do": 1, "switch": 1, "case": 1, "break": 1,
  "continue": 1, "true": 1, "false": 1, "new": 1, "delete": 1, "using": 1,
  "namespace": 1, "template": 1, "typename": 1, "try": 1, "catch": 1, "throw": 1,
  "def": 1, "import": 1, "from": 1, "None": 1, "True": 1, "False": 1, "elif": 1, "in": 1
};

function tokenize(code) {
  var out = "", i = 0, n = code.length;
  function push(cls, text) { out += cls ? '<span class="' + cls + '">' + esc(text) + "</span>" : esc(text); }

  while (i < n) {
    var ch = code.charAt(i);

    if (ch === "#" && (i === 0 || code.charAt(i - 1) === "\n")) {
      var e = code.indexOf("\n", i); if (e < 0) e = n;
      push("pp", code.slice(i, e)); i = e; continue;
    }
    if (ch === "/" && code.charAt(i + 1) === "/") {
      var e2 = code.indexOf("\n", i); if (e2 < 0) e2 = n;
      push("c", code.slice(i, e2)); i = e2; continue;
    }
    if (ch === "/" && code.charAt(i + 1) === "*") {
      var e3 = code.indexOf("*/", i); e3 = e3 < 0 ? n : e3 + 2;
      push("c", code.slice(i, e3)); i = e3; continue;
    }
    if (ch === '"' || ch === "'") {
      var j = i + 1;
      while (j < n && !(code.charAt(j) === ch && code.charAt(j - 1) !== "\\")) j += 1;
      j = Math.min(j + 1, n);
      push("s", code.slice(i, j)); i = j; continue;
    }
    if (ch >= "0" && ch <= "9") {
      var k = i;
      while (k < n && /[0-9.]/.test(code.charAt(k))) k += 1;
      push("n", code.slice(i, k)); i = k; continue;
    }
    if (/[A-Za-z_]/.test(ch)) {
      var m = i;
      while (m < n && /[A-Za-z0-9_]/.test(code.charAt(m))) m += 1;
      var word = code.slice(i, m);
      push(CPP_KEYWORDS[word] ? "k" : "", word); i = m; continue;
    }
    push("", ch); i += 1;
  }
  return out;
}

/* Подсвечивается ровно один фрагмент — первое вхождение focus. */
function codeBlock(code, focus) {
  var inner;
  var at = focus ? code.indexOf(focus) : -1;
  if (at === -1) {
    inner = tokenize(code);
  } else {
    inner = tokenize(code.slice(0, at)) +
            '<span class="highlight">' + tokenize(focus) + "</span>" +
            tokenize(code.slice(at + focus.length));
  }
  return '<pre class="codeblock">' + inner + "</pre>";
}


/* ── Память в пределах сессии ─────────────────────────────── */
var ephemeral = {};
function ekey(ctx, stepId) { return ctx.course.id + "." + ctx.n + "." + stepId; }

function draftKey(courseId, lang, n) { return "draft." + courseId + "." + lang + ".lesson." + n; }
function readDrafts(courseId, lang, n) {
  var raw = readStored(draftKey(courseId, lang, n));
  if (!raw) return {};
  try { return JSON.parse(raw) || {}; } catch (e) { return {}; }
}
function writeDraft(courseId, lang, n, stepId, code) {
  var all = readDrafts(courseId, lang, n);
  all[stepId] = code;
  writeStored(draftKey(courseId, lang, n), JSON.stringify(all));
}

/* Поле из языкового файла главнее поля из структуры. */
function sv(step, tx, field) {
  return tx && tx[field] !== undefined ? tx[field] : step[field];
}

function isArray(x) { return Object.prototype.toString.call(x) === "[object Array]"; }

function normalizeOut(s) {
  return String(s === undefined || s === null ? "" : s)
    .replace(/\r/g, "")
    .replace(/[ \t]+$/gm, "")
    .replace(/\s+$/, "");
}

/* ── Общие куски ──────────────────────────────────────────── */
/* Код внутри текста урока пишется в обратных кавычках: `cout`.
   Сначала всё экранируется, потом `…` становится <code class="ic">,
   поэтому HTML из текста урока попасть на страницу не может. */
function rich(s) {
  return esc(s === undefined || s === null ? "" : s).replace(/`([^`]+)`/g, '<code class="ic">$1</code>');
}

function paras(body) {
  if (!body) return "";
  var list = isArray(body) ? body : [body];
  return list.map(function (p) { return "<p>" + rich(p) + "</p>"; }).join("");
}

function stepHead(tx, step) {
  var flag = step && step.optional
    ? '<div class="step-flags"><span class="badge">' + esc(t("optionalTask")) + "</span></div>"
    : "";
  return flag +
    (tx.eyebrow ? '<div class="eyebrow">' + esc(tx.eyebrow) + "</div>" : "") +
    "<h2>" + rich(tx.title || "") + "</h2>" +
    paras(tx.body);
}

function verdictBox(ok, note, labels) {
  var word = labels ? (ok ? labels[0] : labels[1]) : (ok ? t("answerRight") : t("answerWrong"));
  return '<div class="verdict ' + (ok ? "ok" : "no") + '" role="status">' +
    "<b>" + esc(word) + "</b>" + rich(note || "") + "</div>";
}

function collapsible(tag, title, inner) {
  return '<details class="more">' +
    "<summary>" +
      '<span class="tag">' + esc(tag) + "</span>" +
      '<span class="ttl">' + esc(title || "") + "</span>" +
      chevron() +
    "</summary>" +
    '<div class="more-body">' + inner + "</div>" +
  "</details>";
}

function moreBlocks(tx) {
  var list = tx.more || [];
  return list.map(function (m) {
    var tag = m.kind === "archive" ? t("archiveTag") : t("deeperTag");
    var sources = (m.sources || []).length
      ? '<div class="sources-head">' + esc(t("sourcesTag")) + '</div><ul class="sources">' +
        m.sources.map(function (s) {
          var label = esc(s.title || s.url || "");
          return "<li>" + (s.url ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + label + "</a>" : label) +
            (s.note ? " — " + esc(s.note) : "") + "</li>";
        }).join("") + "</ul>"
      : "";
    return collapsible(tag, m.title, paras(m.body) + sources);
  }).join("");
}

/* ── Виды шагов ───────────────────────────────────────────── */
function theoryView(ctx, step, tx) { return stepHead(tx, step) + figure(ctx, step, tx, false); }

function exampleView(ctx, step, tx) {
  var code = sv(step, tx, "code");
  return stepHead(tx, step) + figure(ctx, step, tx, false) +
    (code ? codeBlock(code, step.focus) : "") +
    (tx.caption ? '<p class="caption">' + rich(tx.caption) + "</p>" : "");
}

/* Картинки двух видов.
   Схема .svg — со словами, своя на каждый язык (поле image в языковом
   файле). Встраивается прямо в страницу, поэтому берёт наши шрифты.
   Иллюстрация .png/.webp — без слов, одна на оба языка (поле image в
   файле структуры, рядом imagePrompt для генерации). */
function figure(ctx, step, tx, always) {
  var img = sv(step, tx, "image");
  var alt = tx.alt || tx.title || "";
  if (img) {
    var url = CONTENT + ctx.course.id + "/" + img;
    if (/\.svg$/i.test(img)) {
      return '<div class="figure svg-slot" data-svg="' + esc(url) + '" role="img" aria-label="' + esc(alt) + '"></div>';
    }
    return '<div class="frame media"><img src="' + esc(url) + '" alt="' + esc(alt) + '"></div>';
  }
  if (always || step.imagePrompt) {
    return '<div class="frame" role="img" aria-label="' + esc(alt) + '">' + esc(t("framePending")) + "</div>";
  }
  return "";
}

function explainView(ctx, step, tx) {
  return stepHead(tx, step) + figure(ctx, step, tx, true) +
    (tx.caption ? '<p class="caption">' + rich(tx.caption) + "</p>" : "");
}

function videoView(ctx, step, tx) {
  var media = step.youtube
    ? '<div class="frame media"><iframe src="https://www.youtube-nocookie.com/embed/' + esc(step.youtube) +
      '" title="' + esc(tx.title || "") + '" allow="accelerometer; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>'
    : '<div class="frame">' + esc(t("videoPending")) + "</div>";
  return stepHead(tx, step) + media + (tx.caption ? '<p class="caption">' + rich(tx.caption) + "</p>" : "");
}

function quizView(ctx, step, tx) {
  var chosen = ephemeral[ekey(ctx, step.id)] || null;
  var order = step.options || Object.keys(tx.options || {});
  var letters = "ABCDEFG";
  var code = sv(step, tx, "code");

  var buttons = order.map(function (id, i) {
    var cls = "choice";
    if (chosen) { if (id === step.answer) cls += " right"; else if (id === chosen) cls += " wrong"; }
    return '<button type="button" class="' + cls + '" data-choice="' + esc(id) + '"' + (chosen ? " disabled" : "") + ">" +
      '<span class="mark">' + letters.charAt(i) + "</span>" +
      "<span>" + rich((tx.options || {})[id] || id) + "</span></button>";
  }).join("");

  return stepHead(tx, step) +
    (code ? codeBlock(code, step.focus) : "") +
    '<div class="quiz">' + buttons + "</div>" +
    (chosen ? verdictBox(chosen === step.answer, tx.explain) : "");
}

function predictView(ctx, step, tx) {
  var k = ekey(ctx, step.id);
  var guess = ephemeral[k + ".guess"] || "";
  var checked = ephemeral[k + ".checked"];
  var expected = String(sv(step, tx, "expected") || "");

  var result = checked
    ? verdictBox(checked === "ok", tx.explain, [t("predictHit"), t("predictMiss")]) +
      '<p class="caption">' + esc(t("actualOutput")) + "</p>" +
      '<pre class="codeblock">' + esc(expected) + "</pre>"
    : "";

  return stepHead(tx, step) +
    codeBlock(sv(step, tx, "code") || "", step.focus) +
    '<label class="field-label" for="predictBox">' + esc(t("yourPrediction")) + "</label>" +
    '<textarea class="predict-in" id="predictBox" rows="3" spellcheck="false"' + (checked ? " readonly" : "") + ">" +
      esc(guess) + "</textarea>" +
    '<div class="actions" style="margin-top: 14px">' +
      (checked
        ? '<button type="button" class="btn" id="predictReset">' + esc(t("tryAgain")) + "</button>"
        : '<button type="button" class="btn primary" id="predictCheck">' + esc(t("checkAnswer")) + "</button>") +
    "</div>" + result;
}

function clicklineView(ctx, step, tx) {
  var chosen = ephemeral[ekey(ctx, step.id)] || null;
  var answer = Number(step.answerLine);
  var lines = String(sv(step, tx, "code") || "").split("\n");

  var rows = lines.map(function (line, i) {
    var n = i + 1, cls = "cline";
    if (chosen) { if (n === answer) cls += " right"; else if (n === chosen) cls += " wrong"; }
    return '<button type="button" class="' + cls + '" data-line="' + n + '"' + (chosen ? " disabled" : "") +
      ' aria-label="' + esc(t("lineWord") + " " + n) + '">' +
      '<span class="ln">' + n + '</span><span class="lc">' + (tokenize(line) || " ") + "</span></button>";
  }).join("");

  return stepHead(tx, step) +
    '<div class="clicklines" role="group" aria-label="' + esc(tx.title || "") + '">' + rows + "</div>" +
    (chosen ? verdictBox(chosen === answer, tx.explain) : "");
}

/* Перемешивание детерминировано по id шага: строки не скачут
   при каждой перерисовке и одинаковы у всех студентов. */
function seededOrder(seed, n) {
  var h = 2166136261;
  for (var i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
  var idx = [];
  for (var j = 0; j < n; j++) idx.push(j);
  for (var k = n - 1; k > 0; k--) {
    h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0;
    var r = h % (k + 1);
    var tmp = idx[k]; idx[k] = idx[r]; idx[r] = tmp;
  }
  var untouched = true;
  for (var q = 0; q < n; q++) { if (idx[q] !== q) { untouched = false; break; } }
  if (untouched && n > 1) idx.push(idx.shift());
  return idx;
}

function parsonsView(ctx, step, tx) {
  var k = ekey(ctx, step.id);
  var lines = sv(step, tx, "lines") || [];
  var order = ephemeral[k + ".order"] || seededOrder(step.id, lines.length);
  ephemeral[k + ".order"] = order;
  var checked = ephemeral[k + ".checked"];
  var allRight = order.every(function (li, pos) { return li === pos; });

  var rows = order.map(function (li, pos) {
    var mark = checked ? (li === pos ? " ok" : " no") : "";
    return '<div class="pline' + mark + '">' +
      "<code>" + (tokenize(lines[li]) || " ") + "</code>" +
      '<button type="button" class="mv" data-mv="up" data-pos="' + pos + '"' + (pos === 0 ? " disabled" : "") +
        ' aria-label="' + esc(t("moveUp")) + '">↑</button>' +
      '<button type="button" class="mv" data-mv="down" data-pos="' + pos + '"' + (pos === order.length - 1 ? " disabled" : "") +
        ' aria-label="' + esc(t("moveDown")) + '">↓</button>' +
    "</div>";
  }).join("");

  return stepHead(tx, step) +
    '<div class="parsons">' + rows + "</div>" +
    '<div class="actions" style="margin-top: 14px">' +
      '<button type="button" class="btn primary" id="parsonsCheck">' + esc(t("checkAnswer")) + "</button>" +
    "</div>" +
    (checked ? verdictBox(allRight, allRight ? tx.explain : t("parsonsAgain")) : "");
}

function blankOk(accepted, value) {
  var list = isArray(accepted) ? accepted : [accepted];
  var norm = function (s) { return String(s === undefined || s === null ? "" : s).replace(/\s+/g, ""); };
  for (var i = 0; i < list.length; i++) { if (norm(list[i]) === norm(value)) return true; }
  return false;
}

function blanksView(ctx, step, tx) {
  var k = ekey(ctx, step.id);
  var code = String(sv(step, tx, "code") || "");
  var answers = sv(step, tx, "blanks") || {};
  var vals = ephemeral[k + ".vals"] || {};
  var checked = ephemeral[k + ".checked"];

  var html = "", re = /\[\[(\w+)\]\]/g, last = 0, m, allOk = true;
  while ((m = re.exec(code))) {
    html += tokenize(code.slice(last, m.index));
    var id = m[1], v = vals[id] || "";
    var ok = blankOk(answers[id], v);
    if (!ok) allOk = false;
    var first = isArray(answers[id]) ? answers[id][0] : answers[id];
    var size = Math.max(4, String(first || "").length + 1);
    html += '<input class="blank-in' + (checked ? (ok ? " ok" : " no") : "") + '" data-blank="' + esc(id) +
      '" value="' + esc(v) + '" size="' + size + '" spellcheck="false" autocomplete="off" autocapitalize="off"' +
      ' aria-label="' + esc(t("blankWord") + " " + id) + '">';
    last = re.lastIndex;
  }
  html += tokenize(code.slice(last));

  return stepHead(tx, step) +
    '<pre class="codeblock">' + html + "</pre>" +
    '<div class="actions" style="margin-top: 14px">' +
      '<button type="button" class="btn primary" id="blanksCheck">' + esc(t("checkAnswer")) + "</button>" +
    "</div>" +
    (checked ? verdictBox(allOk, allOk ? tx.explain : t("blanksAgain")) : "");
}

function editorView(ctx, step, tx) {
  var drafts = readDrafts(ctx.course.id, ctx.lang, ctx.n);
  var starter = sv(step, tx, "starter") || "";
  var code = drafts[step.id] !== undefined ? drafts[step.id] : starter;
  var expected = sv(step, tx, "expected");
  var solution = sv(step, tx, "solution");
  var shown = sv(step, tx, "code");
  var last = ephemeral[ekey(ctx, step.id) + ".out"];
  var ext = step.lang === "python" ? "py" : "cpp";

  var stdinBox = step.stdin === false ? "" :
    '<div><label for="stdinBox">' + esc(t("stdinLabel")) + "</label>" +
    '<textarea id="stdinBox" spellcheck="false">' + esc(step.stdin || "") + "</textarea></div>";

  var verdict = last && last.verdict ? verdictBox(last.verdict === "ok", last.note) : "";

  var extras = "";
  if (tx.hint) extras += collapsible(t("hintTag"), "", "<p>" + rich(tx.hint) + "</p>");
  if (expected !== undefined && !step.hideExpected) {
    extras += collapsible(t("expectedTag"), "", '<pre class="codeblock">' + esc(String(expected)) + "</pre>");
  }
  if (solution) {
    extras += collapsible(t("solutionTag"), t("solutionNote"), codeBlock(String(solution), null) +
      (tx.solutionNote ? "<p>" + rich(tx.solutionNote) + "</p>" : ""));
  }

  return stepHead(tx, step) +
    (shown ? codeBlock(shown, step.focus) : "") +
    (tx.task ? "<p>" + rich(tx.task) + "</p>" : "") +
    '<div class="editor">' +
      '<div class="editor-bar">' +
        '<span class="meta-mono">' + esc(step.lang || "cpp") + " · main." + ext + "</span>" +
        '<span class="editor-actions">' +
          '<button type="button" class="btn small" id="downloadBtn">' + esc(t("downloadCode")) + "</button>" +
          '<button type="button" class="btn small" id="resetBtn">' + esc(t("resetCode")) + "</button>" +
          '<button type="button" class="btn small" id="stopBtn" hidden>' + esc(t("stopRun")) + "</button>" +
          '<button type="button" class="btn primary" id="runBtn">' + esc(t("runCode")) + "</button>" +
        "</span>" +
      "</div>" +
      '<textarea class="code" id="codeBox" spellcheck="false" autocapitalize="off" aria-label="' + esc(tx.title || t("runCode")) + '">' +
        esc(code) + "</textarea>" +
      '<div class="io">' + stdinBox +
        '<div><label for="outBox">' + esc(t("stdoutLabel")) + "</label>" +
        '<pre id="outBox" aria-live="polite">' + esc(last && last.text ? last.text : "") + "</pre></div>" +
      "</div>" +
    "</div>" +
    verdict + extras;
}

function summaryView(ctx, step, tx) {
  var done = isDone(ctx.course.id, ctx.n);
  var points = (tx.points || []).map(function (p) { return "<li>" + rich(p) + "</li>"; }).join("");
  return stepHead(tx, step) +
    (points ? '<ul class="points">' + points + "</ul>" : "") +
    '<div class="actions" style="margin-top: 28px">' +
      '<button type="button" class="btn' + (done ? "" : " primary") + '" id="lessonDone">' +
        esc(done ? t("markNotDone") : t("markDone")) + "</button>" +
    "</div>";
}

var VIEWS = {
  theory: theoryView, example: exampleView, explain: explainView, video: videoView,
  quiz: quizView, predict: predictView, clickline: clicklineView, parsons: parsonsView,
  blanks: blanksView, editor: editorView, summary: summaryView
};

function stepView(ctx, step, texts) {
  var tx = (texts.steps && texts.steps[step.id]) || {};
  var view = VIEWS[step.kind] || theoryView;
  return view(ctx, step, tx) + moreBlocks(tx);
}

/* ── Экран целиком ────────────────────────────────────────── */
function lessonPlayer(ctx, data, texts) {
  var steps = data.steps || [];
  var i = ctx.stepIndex;
  var step = steps[i];
  var hash = function (slug) { return courseHash(ctx.course.id, ctx.lang, ctx.n, slug); };

  /* Полоса шагов кликабельна: вернуться на пятый экран и обратно
     должно стоить один клик. */
  /* Пройдено — всё до самого дальнего шага, а не только левее текущего:
     вернулся с 9-го на 4-й — шаги 5–9 остаются закрашенными. */
  var far = Math.max(ctx.maxIndex || 0, i);
  var bar = steps.map(function (s, idx) {
    var stx = (texts.steps && texts.steps[s.id]) || {};
    var label = (idx + 1) + ". " + String(stx.title || s.id).replace(/`/g, "");
    var cls = idx === i ? "now" : (idx <= far ? "seen" : "");
    if (idx === far && far > i) cls += " far";
    return '<a class="' + cls + '" href="' + hash(s.id) + '" title="' + esc(label) +
      '" aria-label="' + esc(label) + '"' +
      (idx === i ? ' aria-current="step"' : "") + "><i></i></a>";
  }).join("");

  var backToFar = far > i
    ? '<a class="back-far" href="' + hash(steps[far].id) + '">' + esc(t("backToFurthest").replace("{n}", far + 1)) + "</a>"
    : "";

  var prev = i > 0 ? steps[i - 1] : null;
  var nextS = i < steps.length - 1 ? steps[i + 1] : null;

  var nav = '<div class="lessonnav">' +
    (prev ? '<a class="btn" href="' + hash(prev.id) + '">' + esc(t("prevStep")) + "</a>" : "<span></span>") +
    (nextS ? '<a class="btn primary" href="' + hash(nextS.id) + '">' + esc(t("nextStep")) + "</a>"
           : '<a class="btn" href="' + courseHash(ctx.course.id, ctx.lang, null, null) + '">' + esc(t("backToCourse")) + "</a>") +
  "</div>";

  return header() +
    '<main class="screen narrow">' +
      crumbs(ctx.course, ctx.lang, findModule(ctx.course.id, ctx.n)) +
      '<div class="lesson-head" style="margin-top: 10px">' +
        '<div class="eyebrow">' + esc(t("lessonEyebrow")) + " " + ctx.n +
          (texts.module ? " · " + esc(texts.module) : "") + "</div>" +
        '<div class="lesson-tools">' + backToFar + '<span class="meta-mono">' + (i + 1) + " / " + steps.length + "</span>" +
          '<a class="btn small" href="' + printHash(ctx.course.id, ctx.lang, ctx.n) + '">' + esc(t("printLink")) + "</a></div>" +
      "</div>" +
      '<h1 lang="' + ctx.lang + '" style="font-size: clamp(26px, 4vw, 36px)">' + esc(texts.title || "") + "</h1>" +
      '<div class="steps">' + bar + "</div>" +
      '<section class="step" lang="' + ctx.lang + '">' + stepView(ctx, step, texts) + "</section>" +
      nav +
    "</main>" + footer();
}

/* ── Урок без перевода и урок, который ещё не написан ─────── */
function lessonMissingScreen(course, lesson, lang, kind) {
  var other = lesson.locales && lesson.locales.length ? lesson.locales[0] : null;
  var body = kind === "untranslated" && other
    ? "<h1>" + esc(t("notTranslatedTitle")) + "</h1>" +
      '<p class="lead">' + esc(t("notTranslatedBody")) + "</p>" +
      '<div class="actions" style="margin-top: 28px">' +
        '<a class="btn primary" href="' + courseHash(course.id, other, lesson.n, null) + '">' +
          esc(t("openInLang")) + esc(langLabel(other)) + "</a>" +
        '<a class="btn" href="' + courseHash(course.id, lang, null, null) + '">' + esc(t("backToCourse")) + "</a>" +
      "</div>"
    : "<h1>" + esc(t("lessonSoonTitle")) + "</h1>" +
      '<p class="lead">' + esc(t("lessonSoonBody")) + "</p>" +
      '<div class="actions" style="margin-top: 28px">' +
        '<a class="btn primary" href="' + courseHash(course.id, lang, null, null) + '">' + esc(t("backToCourse")) + "</a>" +
      "</div>";

  return header() +
    '<main class="screen narrow">' +
      crumbs(course, lang, findModule(course.id, lesson.n)) +
      '<div class="eyebrow" style="margin-top: 10px">' + esc(t("lessonEyebrow")) + " " + lesson.n + "</div>" +
      body +
    "</main>" + footer();
}

function showLesson(course, lesson, lang, route, token) {
  if (!lesson.locales || !lesson.locales.length) {
    document.title = course.title[state.uiLang] + " — 67coder";
    paint(lessonMissingScreen(course, lesson, lang, "missing"));
    scrollTop();
    return Promise.resolve();
  }
  if (lesson.locales.indexOf(lang) === -1) {
    document.title = course.title[state.uiLang] + " — 67coder";
    paint(lessonMissingScreen(course, lesson, lang, "untranslated"));
    scrollTop();
    return Promise.resolve();
  }

  return Promise.all([
    loadLesson(course.id, lesson.n),
    loadLessonTexts(course.id, lesson.n, lang)
  ]).then(function (pair) {
    if (token !== renderToken) return;

    var data = pair[0], texts = pair[1];
    var steps = data.steps || [];
    var index = 0;
    for (var s = 0; s < steps.length; s++) { if (steps[s].id === route.step) { index = s; break; } }

    var wanted = courseHash(course.id, lang, lesson.n, steps[index] ? steps[index].id : null);
    if (location.hash !== wanted) { history.replaceState(null, "", wanted); lastHash = wanted; }

    var maxKey = "progress." + course.id + ".lesson." + lesson.n + ".max";
    var maxIndex = Math.min(Number(readStored(maxKey)) || 0, steps.length - 1);
    if (index > maxIndex) { maxIndex = index; writeStored(maxKey, String(maxIndex)); }

    var ctx = { course: course, lang: lang, n: lesson.n, stepIndex: index, maxIndex: maxIndex };
    document.title = (texts.title || "") + " — 67coder";
    paint(lessonPlayer(ctx, data, texts));
    scrollTop();
  }).catch(function () {
    if (token !== renderToken) return;
    document.title = course.title[state.uiLang] + " — 67coder";
    paint(lessonMissingScreen(course, lesson, lang, "missing"));
    scrollTop();
  });
}

/* ── Обработчики внутри урока ─────────────────────────────── */
var focusAfter = null;

function loadSvgSlots() {
  var slots = document.querySelectorAll("[data-svg]");
  for (var i = 0; i < slots.length; i++) {
    (function (slot) {
      var url = slot.getAttribute("data-svg");
      var put = function (txt) { if (slot.isConnected) slot.innerHTML = txt; };
      if (cache.svgs[url]) { put(cache.svgs[url]); return; }
      fetch(url, { cache: "no-cache" })
        .then(function (r) { if (!r.ok) throw new Error(url); return r.text(); })
        .then(function (txt) {
          txt = txt.replace(/<\?xml[^>]*\?>/i, "").replace(/<script[\s\S]*?<\/script>/gi, "");
          cache.svgs[url] = txt;
          put(txt);
        })
        .catch(function () {
          if (!slot.isConnected) return;
          slot.className = "frame";
          slot.textContent = t("framePending");
        });
    })(slots[i]);
  }
}

function wireLesson() {
  loadSvgSlots();
  var route = parseHash();
  if (!route.course || !route.lesson) return;

  var data = cache.lessons[route.course + "." + route.lesson];
  var texts = cache.lessonTexts[route.course + "." + route.lesson + "." + route.lang];
  if (!data || !texts) return;

  var step = null;
  for (var s = 0; s < data.steps.length; s++) { if (data.steps[s].id === route.step) step = data.steps[s]; }
  if (!step) return;

  var tx = (texts.steps && texts.steps[step.id]) || {};
  var k = route.course + "." + route.lesson + "." + step.id;

  function rerender(focusSelector) { focusAfter = focusSelector || null; render(); }

  /* Квиз */
  var choices = document.querySelectorAll("[data-choice]");
  for (var c = 0; c < choices.length; c++) {
    choices[c].addEventListener("click", function () {
      ephemeral[k] = this.getAttribute("data-choice");
      rerender();
    });
  }

  /* Найди строку */
  var lines = document.querySelectorAll("[data-line]");
  for (var l = 0; l < lines.length; l++) {
    lines[l].addEventListener("click", function () {
      ephemeral[k] = Number(this.getAttribute("data-line"));
      rerender();
    });
  }

  /* Предскажи вывод */
  var predictCheck = document.getElementById("predictCheck");
  if (predictCheck) {
    predictCheck.addEventListener("click", function () {
      var guess = document.getElementById("predictBox").value;
      ephemeral[k + ".guess"] = guess;
      ephemeral[k + ".checked"] = normalizeOut(guess) === normalizeOut(sv(step, tx, "expected")) ? "ok" : "no";
      rerender("#predictReset");
    });
  }
  var predictReset = document.getElementById("predictReset");
  if (predictReset) {
    predictReset.addEventListener("click", function () {
      delete ephemeral[k + ".checked"];
      rerender("#predictBox");
    });
  }

  /* Собери программу */
  var moves = document.querySelectorAll("[data-mv]");
  for (var mv = 0; mv < moves.length; mv++) {
    moves[mv].addEventListener("click", function () {
      var order = ephemeral[k + ".order"];
      var pos = Number(this.getAttribute("data-pos"));
      var dir = this.getAttribute("data-mv") === "up" ? -1 : 1;
      var to = pos + dir;
      if (!order || to < 0 || to >= order.length) return;
      var tmp = order[pos]; order[pos] = order[to]; order[to] = tmp;
      delete ephemeral[k + ".checked"];
      var target = to === 0 ? "down" : (to === order.length - 1 ? "up" : this.getAttribute("data-mv"));
      rerender('[data-mv="' + target + '"][data-pos="' + to + '"]');
    });
  }
  var parsonsCheck = document.getElementById("parsonsCheck");
  if (parsonsCheck) {
    parsonsCheck.addEventListener("click", function () {
      ephemeral[k + ".checked"] = "yes";
      rerender("#parsonsCheck");
    });
  }

  /* Заполни пропуски */
  var blanks = document.querySelectorAll("[data-blank]");
  for (var b = 0; b < blanks.length; b++) {
    blanks[b].addEventListener("input", function () {
      var vals = ephemeral[k + ".vals"] || {};
      vals[this.getAttribute("data-blank")] = this.value;
      ephemeral[k + ".vals"] = vals;
    });
  }
  var blanksCheck = document.getElementById("blanksCheck");
  if (blanksCheck) {
    blanksCheck.addEventListener("click", function () {
      ephemeral[k + ".checked"] = "yes";
      rerender("#blanksCheck");
    });
  }

  /* Редактор */
  var codeBox = document.getElementById("codeBox");
  var runBtn = document.getElementById("runBtn");
  if (codeBox && runBtn) wireEditor(route, step, tx, k, codeBox, runBtn);

  if (focusAfter) {
    var el = document.querySelector(focusAfter);
    if (el) el.focus();
    focusAfter = null;
  }
}

function wireEditor(route, step, tx, k, codeBox, runBtn) {
  var stopBtn = document.getElementById("stopBtn");
  var resetBtn = document.getElementById("resetBtn");
  var downloadBtn = document.getElementById("downloadBtn");
  var outBox = document.getElementById("outBox");
  var n = Number(route.lesson);
  var outKey = k + ".out";

  var saveTimer = null;
  codeBox.addEventListener("input", function () {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { writeDraft(route.course, route.lang, n, step.id, codeBox.value); }, 400);
  });

  /* Tab в редакторе вставляет отступ, а не уводит фокус.
     Esc отпускает фокус — клавиатура не попадает в ловушку. */
  codeBox.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { codeBox.blur(); return; }
    if (e.key !== "Tab" || e.shiftKey) return;
    e.preventDefault();
    var a = codeBox.selectionStart, z = codeBox.selectionEnd;
    codeBox.value = codeBox.value.slice(0, a) + "    " + codeBox.value.slice(z);
    codeBox.selectionStart = codeBox.selectionEnd = a + 4;
  });

  if (downloadBtn) {
    downloadBtn.addEventListener("click", function () {
      var ext = step.lang === "python" ? "py" : "cpp";
      var blob = new Blob([codeBox.value], { type: "text/plain;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = route.course + "-" + pad2(n) + "-" + step.id + "." + ext;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
    });
  }

  if (resetBtn) {
    resetBtn.addEventListener("click", function () {
      codeBox.value = sv(step, tx, "starter") || "";
      writeDraft(route.course, route.lang, n, step.id, codeBox.value);
      delete ephemeral[outKey];
      focusAfter = "#codeBox";
      render();
    });
  }

  stopBtn.addEventListener("click", function () {
    runner.stop();
    stopBtn.hidden = true;
    runBtn.disabled = false;
    outBox.textContent = t("runStopped");
  });

  runBtn.addEventListener("click", function () {
    var stdinBox = document.getElementById("stdinBox");
    writeDraft(route.course, route.lang, n, step.id, codeBox.value);

    runBtn.disabled = true;
    stopBtn.hidden = false;
    outBox.textContent = t("running");

    runner.onStatus = function (msg) {
      if (msg.text === "toolchain") outBox.textContent = t("loadingEngine") + (msg.percent ? " " + msg.percent + "%" : "");
      else if (msg.text === "compiling") outBox.textContent = t("compiling");
      else if (msg.text === "running") outBox.textContent = t("running");
    };

    var expected = sv(step, tx, "expected");
    var codeNow = codeBox.value;

    runner.run(step.lang || "cpp", codeNow, stdinBox ? stdinBox.value : "")
      .then(function (res) {
        runner.onStatus = null;
        var failed = res.exitCode !== 0 || res.stage === "compile";
        var text = (res.stdout || "") + (res.stderr ? (res.stdout ? "\n" : "") + res.stderr : "");
        var verdict = null, note = "";

        if (res.stage === "compile") {
          verdict = "no"; note = t("compileFailed");
        } else if (expected !== undefined) {
          var ok = !failed && normalizeOut(res.stdout) === normalizeOut(String(expected));
          /* Шаг может требовать конкретный приём, а не только верный вывод. */
          var missing = (step.requires || []).filter(function (r) { return codeNow.indexOf(r) === -1; });
          if (ok && missing.length) { ok = false; note = t("mustUse") + " " + missing.join(", "); }
          else note = ok ? t("runRightNote") : t("runWrongNote");
          verdict = ok ? "ok" : "no";
        }

        ephemeral[outKey] = { text: text || t("noOutput"), verdict: verdict, note: note };
        focusAfter = "#runBtn";
        render();
      })
      .catch(function (err) {
        runner.onStatus = null;
        var m = err && err.message;
        ephemeral[outKey] = {
          text: m === "stopped" ? t("runStopped")
              : m === "engine-not-connected" ? t("engineMissing")
              : t("engineBroken") + "\n" + String(m || err),
          verdict: null, note: ""
        };
        focusAfter = "#runBtn";
        render();
      });
  });
}


/* ════════════════════════════════════════════════════════════
   ВСЯ ГЛАВА ОДНОЙ СТРАНИЦЕЙ — ДЛЯ PDF

   #/course/{course}/{lang}/print/{n}
   Все экраны урока подряд, раскрывающиеся блоки раскрыты,
   ответы и решения — в конце. Светлая страница в любой теме
   сайта. Источник тот же JSON, поэтому PDF всегда совпадает
   с интерактивной главой.
   ════════════════════════════════════════════════════════════ */

function printHash(courseId, lang, n) { return "#/course/" + courseId + "/" + lang + "/print/" + n; }

function printFigure(ctx, step, tx) {
  var img = sv(step, tx, "image");
  if (!img) return "";
  var url = CONTENT + ctx.course.id + "/" + img;
  var alt = tx.alt || tx.title || "";
  return /\.svg$/i.test(img)
    ? '<div class="figure svg-slot" data-svg="' + esc(url) + '" role="img" aria-label="' + esc(alt) + '"></div>'
    : '<div class="p-figure"><img src="' + esc(url) + '" alt="' + esc(alt) + '"></div>';
}

function printMore(tx) {
  return (tx.more || []).map(function (m) {
    var src = (m.sources || []).length
      ? '<ul class="p-sources">' + m.sources.map(function (s) {
          return "<li>" + (s.url ? '<a href="' + esc(s.url) + '">' + esc(s.title || s.url) + "</a>" : esc(s.title || "")) + "</li>";
        }).join("") + "</ul>"
      : "";
    return '<div class="p-more">' +
      '<div class="p-tag">' + esc(m.kind === "archive" ? t("archiveTag") : t("deeperTag")) + "</div>" +
      "<h3>" + rich(m.title || "") + "</h3>" + paras(m.body) + src +
    "</div>";
  }).join("");
}

function numberedCode(code) {
  var lines = String(code || "").split("\n");
  return '<pre class="codeblock p-numbered">' + lines.map(function (line, i) {
    return '<span class="ln">' + (i + 1) + "</span>" + (tokenize(line) || " ");
  }).join("\n") + "</pre>";
}

function printStep(ctx, step, tx, num, answers) {
  var out = "";
  var task = function (key) { return '<p class="p-task">' + esc(t(key)) + "</p>"; };
  var answer = function (html) { answers.push({ num: num, title: tx.title || step.id, html: html }); };
  var expected = sv(step, tx, "expected");

  if (step.kind === "theory" || step.kind === "explain") {
    out += printFigure(ctx, step, tx) + (tx.caption ? '<p class="caption">' + rich(tx.caption) + "</p>" : "");
  } else if (step.kind === "example") {
    var c = sv(step, tx, "code");
    out += printFigure(ctx, step, tx) + (c ? codeBlock(c, step.focus) : "") +
      (tx.caption ? '<p class="caption">' + rich(tx.caption) + "</p>" : "");
  } else if (step.kind === "predict") {
    out += codeBlock(sv(step, tx, "code") || "", step.focus) + task("pTaskPredict") + '<div class="p-box"></div>';
    answer("<p>" + esc(t("actualOutput")) + '</p><pre class="codeblock">' + esc(String(expected || "")) + "</pre>" + paras(tx.explain));
  } else if (step.kind === "editor") {
    var shown = sv(step, tx, "code"), starter = sv(step, tx, "starter"), solution = sv(step, tx, "solution");
    out += (shown ? codeBlock(shown, step.focus) : "") +
      (tx.task ? '<p class="p-task">' + rich(tx.task) + "</p>" : "") +
      (starter ? '<p class="p-label">' + esc(t("pStarter")) + "</p>" + codeBlock(starter, null) : "") +
      (typeof step.stdin === "string" && step.stdin ? '<p class="p-label">' + esc(t("stdinLabel")) + '</p><pre class="codeblock">' + esc(step.stdin) + "</pre>" : "") +
      (expected !== undefined && !step.hideExpected ? '<p class="p-label">' + esc(t("expectedTag")) + '</p><pre class="codeblock">' + esc(String(expected)) + "</pre>" : "") +
      (tx.hint ? '<p class="p-hint"><strong>' + esc(t("hintTag")) + ".</strong> " + rich(tx.hint) + "</p>" : "") +
      '<p class="p-where">' + esc(t("pRunWhere")) + "</p>";
    if (solution) answer(codeBlock(String(solution), null) + (tx.solutionNote ? "<p>" + rich(tx.solutionNote) + "</p>" : ""));
  } else if (step.kind === "clickline") {
    out += numberedCode(sv(step, tx, "code")) + task("pTaskClick");
    answer("<p>" + esc(t("lineWord")) + " " + esc(String(step.answerLine)) + ".</p>" + paras(tx.explain));
  } else if (step.kind === "parsons") {
    var lines = sv(step, tx, "lines") || [];
    var order = seededOrder(step.id, lines.length);
    out += '<pre class="codeblock p-numbered">' + order.map(function (li, i) {
      return '<span class="ln">' + "ABCDEFGHIJ".charAt(i) + "</span>" + (tokenize(lines[li]) || " ");
    }).join("\n") + "</pre>" + task("pTaskParsons");
    answer('<p>' + esc(t("pCorrectOrder")) + " " + lines.map(function (_, k) {
      return "ABCDEFGHIJ".charAt(order.indexOf(k));
    }).join(" → ") + "</p>" + codeBlock(lines.join("\n"), null) + paras(tx.explain));
  } else if (step.kind === "blanks") {
    var code = String(sv(step, tx, "code") || ""), answersMap = sv(step, tx, "blanks") || {};
    var html = "", re = /\[\[(\w+)\]\]/g, last = 0, m;
    while ((m = re.exec(code))) {
      html += tokenize(code.slice(last, m.index)) + '<span class="p-blank">(' + esc(m[1]) + ")______</span>";
      last = re.lastIndex;
    }
    html += tokenize(code.slice(last));
    out += '<pre class="codeblock">' + html + "</pre>" + task("pTaskBlanks");
    answer("<ul>" + Object.keys(answersMap).map(function (k) {
      var a = answersMap[k];
      return "<li>(" + esc(k) + ") <code>" + esc(isArray(a) ? a[0] : a) + "</code></li>";
    }).join("") + "</ul>" + paras(tx.explain));
  } else if (step.kind === "quiz") {
    var qc = sv(step, tx, "code"), ids = step.options || Object.keys(tx.options || {});
    out += (qc ? codeBlock(qc, step.focus) : "") +
      '<ol class="p-options" type="A">' + ids.map(function (id) { return "<li>" + rich((tx.options || {})[id] || id) + "</li>"; }).join("") + "</ol>";
    var at = ids.indexOf(step.answer);
    answer("<p>" + esc(t("pCorrectAnswer")) + " " + "ABCDEFG".charAt(at) + " — " + rich((tx.options || {})[step.answer] || step.answer) + ".</p>" + paras(tx.explain));
  } else if (step.kind === "summary") {
    out += (tx.points || []).length ? '<ul class="points">' + tx.points.map(function (p) { return "<li>" + rich(p) + "</li>"; }).join("") + "</ul>" : "";
  }
  return out;
}

function printView(ctx, data, texts) {
  var answers = [];
  var steps = data.steps || [];
  var body = steps.map(function (step, i) {
    var tx = (texts.steps && texts.steps[step.id]) || {};
    return '<section class="p-step">' +
      '<div class="p-num">' + esc(t("pStep")) + " " + (i + 1) + (tx.eyebrow ? " · " + esc(tx.eyebrow) : "") +
        (step.optional ? " · " + esc(t("optionalTask")) : "") + "</div>" +
      "<h2>" + rich(tx.title || "") + "</h2>" + paras(tx.body) +
      printStep(ctx, step, tx, i + 1, answers) + printMore(tx) +
    "</section>";
  }).join("");

  var appendix = answers.length
    ? '<section class="p-answers"><h2>' + esc(t("answersTitle")) + "</h2>" +
      answers.map(function (a) {
        return '<div class="p-answer"><div class="p-num">' + esc(t("pStep")) + " " + a.num + "</div><h3>" + rich(a.title) + "</h3>" + a.html + "</div>";
      }).join("") + "</section>"
    : "";

  var mod = findModule(ctx.course.id, ctx.n);
  var back = courseHash(ctx.course.id, ctx.lang, ctx.n, null);

  return '<div class="print-bar">' +
      '<a class="btn" href="' + back + '">' + esc(t("printBack")) + "</a>" +
      '<span class="hint">' + esc(t("printHint")) + "</span>" +
      '<button type="button" class="btn primary" id="printNow">' + esc(t("printNow")) + "</button>" +
    "</div>" +
    '<article class="printdoc" lang="' + ctx.lang + '">' +
      '<header class="p-head">' +
        '<svg viewBox="51 45 138 150" aria-hidden="true" style="color: #5A5F68">' +
          markSvg("#D8D0C2", "#16181D", "#5A5F68", false) + "</svg>" +
        '<span class="p-brand">[<b>67</b>]coder</span>' +
        '<span class="p-course">' + esc(ctx.course.title[ctx.lang] || ctx.course.title[state.uiLang]) +
          (mod ? " · " + esc(moduleName(ctx.course.id, mod)) : "") + "</span>" +
      "</header>" +
      '<div class="p-num" style="margin-top: 28px">' + esc(t("lessonEyebrow")) + " " + ctx.n + "</div>" +
      "<h1>" + esc(texts.title || "") + "</h1>" +
      body + appendix +
      '<footer class="p-foot">67coder.com · ' + esc(ctx.course.title[ctx.lang] || "") + " · " + esc(t("lessonEyebrow")) + " " + ctx.n + "</footer>" +
    "</article>";
}

function showPrint(course, lesson, lang, token) {
  if (!lesson.locales || lesson.locales.indexOf(lang) === -1) {
    paint(lessonMissingScreen(course, lesson, lang, lesson.locales && lesson.locales.length ? "untranslated" : "missing"));
    return Promise.resolve();
  }
  return Promise.all([loadLesson(course.id, lesson.n), loadLessonTexts(course.id, lesson.n, lang)])
    .then(function (pair) {
      if (token !== renderToken) return;
      var wanted = printHash(course.id, lang, lesson.n);
      if (location.hash !== wanted) { history.replaceState(null, "", wanted); lastHash = wanted; }
      document.body.classList.add("is-print");
      document.title = String(lesson.n).padStart(2, "0") + " · " + (pair[1].title || "") + " — 67coder";
      paint(printView({ course: course, lang: lang, n: lesson.n }, pair[0], pair[1]));
      loadSvgSlots();
      var btn = document.getElementById("printNow");
      if (btn) btn.addEventListener("click", function () { window.print(); });
      scrollTop();
    })
    .catch(function () {
      if (token !== renderToken) return;
      paint(lessonMissingScreen(course, lesson, lang, "missing"));
    });
}

/* ── Служебные экраны ─────────────────────────────────────── */
function loadingScreen() {
  return header() + '<main class="screen"><p class="muted">' + esc(t("loading")) + "</p></main>";
}
function errorScreen(detail) {
  return header() +
    '<main class="screen narrow">' +
      "<h1>" + esc(t("errorTitle")) + "</h1>" +
      '<p class="lead">' + esc(t("errorBody")) + "</p>" +
      '<p class="meta-mono" style="margin-top: 18px">' + esc(detail) + "</p>" +
      '<div class="actions" style="margin-top: 28px">' +
        '<button type="button" class="btn primary" id="retryBtn">' + esc(t("retry")) + "</button>" +
      "</div>" +
    "</main>" + footer();
}

/* ── Запуск ───────────────────────────────────────────────── */
var app = document.getElementById("app");

function applyTheme(theme) {
  if (theme === "light") document.documentElement.setAttribute("data-theme", "light");
  else document.documentElement.removeAttribute("data-theme");
}

function paint(html) {
  app.innerHTML = html;
  wire();
}

/* Перерисовка того же адреса (ответ на квиз, перестановка строки)
   не должна бросать студента в начало страницы. */
var lastHash = null, keepScroll = false;
function scrollTop() { if (!keepScroll) window.scrollTo(0, 0); }

function render() {
  var token = ++renderToken;
  keepScroll = location.hash === lastHash;
  lastHash = location.hash;
  document.body.classList.remove("is-print");
  var route = parseHash();
  var fresh = !cache.catalog;

  if (fresh) paint(loadingScreen());

  loadCatalog().then(function (courses) {
    if (token !== renderToken) return;

    if (route.screen !== "course") {
      state.contentLang = state.uiLang;
      document.documentElement.lang = state.uiLang;
      document.title = t("htmlTitle");
      paint(catalogScreen(courses));
      scrollTop();
      return;
    }

    var course = findCourse(route.course);
    if (!course) { location.replace("#/catalog"); return; }

    /* Язык в адресе главнее сохранённого: это выбор преподавателя. */
    if (route.lang && knownLang(route.lang) && route.lang !== state.uiLang) {
      state.uiLang = route.lang;
      writeStored(LANG_KEY, route.lang);
    }

    return loadStructure(course.id).then(function () {
      var resolved = resolveCourseLang(course, route.lang || state.uiLang);
      state.contentLang = resolved.lang;

      /* Названия нужны на всех локалях курса: непереведённый урок
         показывается на том языке, на котором он есть. */
      var needed = courseLocales(course.id);
      if (needed.indexOf(state.uiLang) === -1 && knownLang(state.uiLang)) {
        /* язык интерфейса без контента — тексты для него не грузим */
      }
      return Promise.all(needed.map(function (code) { return loadTexts(course.id, code); }))
        .then(function () {
          if (token !== renderToken) return;

          var lesson = route.lesson ? findLesson(course.id, route.lesson) : null;
          document.documentElement.lang = state.uiLang;

          if (route.print) {
            var printed = findLesson(course.id, route.print);
            if (printed) return showPrint(course, printed, resolved.lang, token);
          }
          if (lesson) return showLesson(course, lesson, resolved.lang, route, token);

          var wantedCourse = route.module
            ? moduleHash(course.id, resolved.lang, route.module)
            : courseHash(course.id, resolved.lang, null, null);
          if (location.hash !== wantedCourse) history.replaceState(null, "", wantedCourse);
          document.title = course.title[state.uiLang] + " — 67coder";
          paint(courseScreen(course, resolved));

          var anchor = route.module ? document.getElementById("mod-" + route.module) : null;
          if (anchor) anchor.scrollIntoView({ block: "start" });
          else scrollTop();
        });
    });
  }).catch(function (err) {
    if (token !== renderToken) return;
    paint(errorScreen(String(err && err.message ? err.message : err)));
  });
}

function wire() {
  var picker = document.getElementById("langpick");
  if (picker) {
    picker.addEventListener("change", function () {
      var next = picker.value;
      if (!knownLang(next)) return;
      state.uiLang = next;
      writeStored(LANG_KEY, next);

      var route = parseHash();
      if (route.screen === "course") {
        location.hash = courseHash(route.course, next, route.lesson, route.step);
      }
      render();
    });
  }

  var themeBtn = document.getElementById("themeBtn");
  if (themeBtn) {
    themeBtn.addEventListener("click", function () {
      var next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
      applyTheme(next);
      writeStored(THEME_KEY, next);
      render();
    });
  }

  var lessonDone = document.getElementById("lessonDone");
  if (lessonDone) {
    lessonDone.addEventListener("click", function () {
      var r = parseHash();
      if (!r.course || !r.lesson) return;
      toggleDone(r.course, Number(r.lesson));
      render();
    });
  }

  wireLesson();

  var retryBtn = document.getElementById("retryBtn");
  if (retryBtn) {
    retryBtn.addEventListener("click", function () {
      cache.catalog = null;
      cache.structure = {};
      cache.texts = {};
      cache.lessons = {};
      cache.lessonTexts = {};
      cache.svgs = {};
      render();
    });
  }
}

(function start() {
  var storedLang = readStored(LANG_KEY);
  if (storedLang && knownLang(storedLang)) state.uiLang = storedLang;
  applyTheme(readStored(THEME_KEY) === "light" ? "light" : "dark");
  if (!location.hash) location.replace("#/catalog");
  window.addEventListener("hashchange", render);
  render();
})();

</script>
